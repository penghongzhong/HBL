name: HBL fixed-domain Kummer actual source parameter stability strict
on:
  push:
    branches: [hbl-213-spectral-c1-trace-20261109]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeKummerFixedDomainParameterStability.lean'
      - '.github/workflows/hbl-213-fixed-domain-kummer-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-parameter-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install identical pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/hbl-213-spectral-four-piece-nonlinear-PDE-telescope.yml').read_text()
          chunk=text.split('      - name: Install pinned compiler\n',1)[1].split('\n      - ',1)[0]
          Path('/tmp/hbl-fixed-compiler.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-fixed-compiler.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve identical pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/hbl-213-spectral-four-piece-nonlinear-PDE-telescope.yml').read_text()
          chunk=text.split('      - name: Resolve exact dependencies\n',1)[1].split('\n      - ',1)[0]
          Path('/tmp/hbl-fixed-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-fixed-dependencies.sh
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: hbl-fixed-parameter-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-fixed-parameter-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-spectral-four-piece-recheck-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-half-power-L2-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Build actual operator stability module
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.TypeIIDynamicSelection.ActualHartreeKummerFixedDomainParameterStability > evidence/build.log 2>&1 || { tail -240 evidence/build.log; exit 1; }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .lake/build
          key: hbl-fixed-parameter-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Strict source and exact kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeKummerFixedDomainParameterStability.lean
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > HBLFixedDomainParameterAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeKummerFixedDomainParameterStability
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_parameter_difference_exact
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_fixed_domain_source_parameter_stability
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_same_parameter_nonzero_matched_jet_source_gain
          set_option pp.all false
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_parameter_difference_exact
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_fixed_domain_source_parameter_stability
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_same_parameter_nonzero_matched_jet_source_gain
          EOF
          lake env lean --trust=0 -DwarningAsError=true HBLFixedDomainParameterAudit.lean > evidence/audit.log 2>&1 || { cat evidence/audit.log; exit 1; }
          cat evidence/audit.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('evidence/audit.log').read_text()
          assert not any(s in text for s in ('sorryAx','admit','Lean.ofReduceBool','⋯','…'))
          allowed={'propext','Classical.choice','Quot.sound'}
          for short in ['actual_Kummer_parameter_difference_exact','actual_Kummer_fixed_domain_source_parameter_stability','actual_Kummer_same_parameter_nonzero_matched_jet_source_gain']:
              name='HBL.TypeIIDynamicSelection.'+short
              reports=re.findall(re.escape("'"+name+"'")+r' depends on axioms:\s*\[([^\]]*)\]',text)
              assert len(reports)==1,(name,reports)
              axioms={re.sub(r'\.\{.*\}$','',s.strip()) for s in reports[0].split(',') if s.strip()}
              assert axioms<=allowed,(name,axioms)
              print('STRICT TARGET:',name,'AXIOMS:',sorted(axioms))
          print('SCOPE: same-parameter nonzero matched-jet source control plus existing parameter bridge; actual Hartree source time gain and main theorem NOT certified; original count 11/13 unchanged.')
          PY
          cp "$target" HBLFixedDomainParameterAudit.lean evidence/
          sha256sum evidence/*.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hbl-fixed-domain-kummer-parameter-strict-evidence
          path: evidence
          retention-days: 30
