name: HBL speed regular Green strict
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSpeedRegularGreen.lean'
      - '.github/workflows/hbl-speed-regular-green.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-speed-regular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {MATHLIB_NO_CACHE_ON_UPDATE: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-speed-regular-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-kummer-upper-jet-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-exterior-feedback-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict speed regular Green audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeSpeedRegularGreen.lean
          lake build HBL.TypeIIDynamicSelection.ActualHartreeSpeedRegularGreen > evidence/build.log 2>&1 || { tail -180 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > SpeedRegularAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeSpeedRegularGreen
          set_option pp.all true
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_scaled_speed_outer_inverse_radius
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_speed_regular_Green_coefficients
          #check @HBL.TypeIIDynamicSelection.actual_moment_locked_regular_source_coefficient_add_mul_on
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_scaled_speed_outer_inverse_radius
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_speed_regular_Green_coefficients
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_moment_locked_regular_source_coefficient_add_mul_on
          EOF
          lake env lean --trust=0 -DwarningAsError=true SpeedRegularAudit.lean > evidence/audit.log 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('evidence/audit.log').read_text()
          assert 'sorryAx' not in t and not re.search(r'\b(error|warning):|⋯|\.\.\.',t)
          allowed={'propext','Classical.choice','Quot.sound'}
          for name,ax in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",t):
            assert {x.strip() for x in ax.split(',') if x.strip()} <= allowed,(name,ax)
          PY
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          cp "$target" evidence/sources/HBL/TypeIIDynamicSelection/
          sha256sum "$target" > evidence/source-hashes.txt
          cp SpeedRegularAudit.lean evidence/
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .lake/build
          key: hbl-speed-regular-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-speed-regular-green-audit
          path: evidence
          retention-days: 14
