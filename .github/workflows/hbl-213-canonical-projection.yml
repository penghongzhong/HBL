name: HBL 2.13 canonical physical projection and exact matching criterion
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualKummerTransmissionProjection*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualOriginProjectionCancellation.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeCanonicalProjection*.lean'
      - '.github/workflows/hbl-213-canonical-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-canonical-projection-20261104
  cancel-in-progress: true
jobs:
  strict-canonical-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install the identical pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/hbl-213-transmission-projection.yml').read_text()
          c=s.split('      - name: Install exact compiler\n',1)[1].split('\n      - ',1)[0]
          Path('/tmp/hbl-compiler.sh').write_text(textwrap.dedent(c.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-compiler.sh
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve the identical pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/hbl-213-transmission-projection.yml').read_text()
          c=s.split('      - name: Resolve pinned dependencies\n',1)[1].split('\n      - ',1)[0]
          Path('/tmp/hbl-deps.sh').write_text(textwrap.dedent(c.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-deps.sh
      - name: Restore accepted accumulated proof pool
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-canonical-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-canonical-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-transmission-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-canonical-transmission-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict complete physical projection audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          for f in ['ActualKummerTransmissionProjection','ActualOriginProjectionCancellation','ActualHartreeCanonicalProjection']:
              s=re.sub(r'/\-.*?\-/','',Path('HBL/TypeIIDynamicSelection/'+f+'.lean').read_text(),flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s),f
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeCanonicalProjection HBL.TypeIIDynamicSelection.ActualHartreeCanonicalProjectionAudit 2>&1 | tee evidence/build.log
          for f in ActualKummerTransmissionProjection ActualOriginProjectionCancellation ActualHartreeCanonicalProjection; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/TypeIIDynamicSelection/${f}.lean" 2>&1 | tee "evidence/${f}-strict.log"
          done
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeCanonicalProjectionAudit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          names=['actual_origin_outgoing_flux_hasDerivAt','actual_Kummer_interface_defect_projection_exact','actual_origin_transmission_defect_projection_balance','actual_origin_projected_left_defect_exact','actual_origin_projected_matching_iff_zero_obstruction','actual_origin_projected_transmission_same_equation','actual_Hartree_canonical_projection_and_exact_matching']
          for v in names:
              n='HBL.TypeIIDynamicSelection.'+v
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT CANONICAL PROJECTION PASS: the same physical inner solution realizes the exact retained-error projection and the iff criterion for source-preserving finite-annulus matching. Actual parameter cancellation, full higher-profile residual and Type-II construction remain OPEN.')
          PY
      - name: Save accumulated proof pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-canonical-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/sources
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualKummerTransmissionProjection.lean HBL/TypeIIDynamicSelection/ActualOriginProjectionCancellation.lean HBL/TypeIIDynamicSelection/ActualHartreeCanonicalProjection*.lean > evidence/source-hashes.txt
          cp HBL/TypeIIDynamicSelection/ActualKummerTransmissionProjection.lean HBL/TypeIIDynamicSelection/ActualOriginProjectionCancellation.lean HBL/TypeIIDynamicSelection/ActualHartreeCanonicalProjection*.lean evidence/sources/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-canonical-projection-audit
          path: evidence
          retention-days: 14
