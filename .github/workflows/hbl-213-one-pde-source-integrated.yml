name: HBL 2.13 unified actual Hartree PDE source and all three strict Riesz spatial tails
on:
  push:
    branches: [hbl-213-one-pde-source-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeFourComponentCubicControl*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionTenTermNorm*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeOnePhysicalNonlinearSourceGain*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeFourComponentCubicControl*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionTenTermNorm*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeTenTermEnvelopeMonotone*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeCoreRieszSpatialDecay*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreePureRadiationRieszSpatialDecay*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeThreeFredholmEnvelopes*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeFullMixedRieszSpatialDecay*.lean'
      - '.github/workflows/hbl-213-one-pde-source-integrated.yml'
  pull_request:
    branches: [hbl-213-one-pde-source-integrated-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-one-pde-source-integrated-20261103
  cancel-in-progress: true
jobs:
  strict-joint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: hbl-typeii-dynamic-new-20261029
          restore-keys: |
            hbl-noncompact-gradient-
      - name: Resolve pinned mathlib dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Restore last successful compiled project
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-physical-C2-overlap-cutoff-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ hashFiles('HBL/TypeIIDynamicSelection/ActualHartreePhysicalSpatialCutoffSourceGain*.lean') }}
          restore-keys: |
            hbl-212-joined-physical-flow-and-inner-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-212-physical-source-integration-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-212-physical-spatial-commutator-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-typeii-dynamic-project-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict build source and kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = ["ActualHartreeOnePhysicalNonlinearSourceGain","ActualHartreeFourComponentCubicControl","ActualHartreePhysicalInteractionTenTermNorm","ActualHartreeTenTermEnvelopeMonotone","ActualHartreeCoreRieszSpatialDecay","ActualHartreePureRadiationRieszSpatialDecay","ActualHartreeThreeFredholmEnvelopes","ActualHartreeFullMixedRieszSpatialDecay"]
          for n in files:
              source = Path('HBL/TypeIIDynamicSelection/'+n+'.lean').read_text()
              source = re.sub(r'/\-.*?\-/', '', source, flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|unsafe|native_decide)\b',source),n
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeOnePhysicalNonlinearSourceGain HBL.TypeIIDynamicSelection.ActualHartreeOnePhysicalNonlinearSourceGainAudit HBL.TypeIIDynamicSelection.ActualHartreeFourComponentCubicControl HBL.TypeIIDynamicSelection.ActualHartreeFourComponentCubicControlAudit HBL.TypeIIDynamicSelection.ActualHartreePhysicalInteractionTenTermNorm HBL.TypeIIDynamicSelection.ActualHartreePhysicalInteractionTenTermNormAudit HBL.TypeIIDynamicSelection.ActualHartreeTenTermEnvelopeMonotone HBL.TypeIIDynamicSelection.ActualHartreeTenTermEnvelopeMonotoneAudit HBL.TypeIIDynamicSelection.ActualHartreeCoreRieszSpatialDecay HBL.TypeIIDynamicSelection.ActualHartreeCoreRieszSpatialDecayAudit HBL.TypeIIDynamicSelection.ActualHartreePureRadiationRieszSpatialDecay HBL.TypeIIDynamicSelection.ActualHartreePureRadiationRieszSpatialDecayAudit HBL.TypeIIDynamicSelection.ActualHartreeThreeFredholmEnvelopes HBL.TypeIIDynamicSelection.ActualHartreeThreeFredholmEnvelopesAudit HBL.TypeIIDynamicSelection.ActualHartreeFullMixedRieszSpatialDecay HBL.TypeIIDynamicSelection.ActualHartreeFullMixedRieszSpatialDecayAudit 2>&1 | tee evidence/build.log
          for n in ActualHartreeOnePhysicalNonlinearSourceGain ActualHartreeFourComponentCubicControl ActualHartreePhysicalInteractionTenTermNorm ActualHartreeTenTermEnvelopeMonotone ActualHartreeCoreRieszSpatialDecay ActualHartreePureRadiationRieszSpatialDecay ActualHartreeThreeFredholmEnvelopes ActualHartreeFullMixedRieszSpatialDecay; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/TypeIIDynamicSelection/${n}.lean" 2>&1 | tee "evidence/${n}-strict.log"
            lake env lean --trust=0 -DwarningAsError=true "HBL/TypeIIDynamicSelection/${n}Audit.lean" 2>&1 | tee -a evidence/audit.log
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('evidence/audit.log').read_text()
          for name in ["actual_Hartree_one_radiation_full_nonlinear_source_gain","actual_Hartree_four_product_complete_cubic_norm_le","actual_Hartree_physical_interaction_complete_ten_term_norm_le","actual_Hartree_complete_ten_term_polynomial_mono","actual_Hartree_moving_core_Riesz_global_inverse_radius","actual_Hartree_pure_radiation_Riesz_global_scaled_decay","actual_Hartree_three_Fredholm_scalar_envelopes","actual_Hartree_full_mixed_Riesz_spatial_decay"]:
              n='HBL.TypeIIDynamicSelection.'+name
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,'missing transitive axioms: '+n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT PASS: SAME real Hartree physical source, full ten-term norm/monotonicity, original three Riesz potentials and scalar critical 1/8 envelopes coexist in one Lean 4.35 dependency tree. Full 2.13 and Type II rate remain OPEN.')
          PY
      - name: Save incremental HBL Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-one-pde-source-integrated-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store audit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualHartreeOnePhysicalNonlinearSourceGain*.lean HBL/TypeIIDynamicSelection/ActualHartreeFourComponentCubicControl*.lean HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionTenTermNorm*.lean HBL/TypeIIDynamicSelection/ActualHartreeTenTermEnvelopeMonotone*.lean HBL/TypeIIDynamicSelection/ActualHartreeCoreRieszSpatialDecay*.lean HBL/TypeIIDynamicSelection/ActualHartreePureRadiationRieszSpatialDecay*.lean HBL/TypeIIDynamicSelection/ActualHartreeThreeFredholmEnvelopes*.lean HBL/TypeIIDynamicSelection/ActualHartreeFullMixedRieszSpatialDecay*.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-one-pde-source-integrated-audit
          path: evidence
          retention-days: 14
