name: HBL revised 2.13 actual physical producers integrated strict
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartree213PhysicalProducers.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSelectedKummerClockFeedbackH1.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerMovingPhysicalPDENextLockedGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeCramerMovingColumnsLipschitz.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSelectedGreenTimeDerivative.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairClockRelativeSpeed.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMatchedKummerRepairTwoC1Jets.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeLockedCorrectionResidualAtom.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairPhysicalH1TimeGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairPhysicalH1TimeGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSelectedKummerClockFeedback.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairTrueBackgroundTimeGainSqrtRadius.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairCenterTimeGainSqrtRadius.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairClockSqrtRadius.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSelectedKummerRepairGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairTrueBackgroundTimeGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeLockedPhysicalGain.lean'
      - '.github/workflows/hbl-213-physical-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-selected-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-selected-repair-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-selected-jet-order-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-kummer-atom-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict selected Kummer repair gain audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartree213PhysicalProducers.lean
          module=HBL.TypeIIDynamicSelection.ActualHartree213PhysicalProducers
          lake build "$module" > evidence/build.log 2>&1 || { tail -240 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > HBL213PhysicalProducersAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartree213PhysicalProducers
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_correction_remainder_locked_realized_atom
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_selected_repair_full_true_Hartree_feedback_and_H1_from_clock
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_moving_Kummer_outer_repair_full_PDE_next_locked_gain
          #check @HBL.TypeIIDynamicSelection.actual_real_Cramer_two_matrix_difference_bound
          #check @HBL.TypeIIDynamicSelection.actual_Cramer_selected_frozen_Green_time_derivative
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_slice_clock_locked_relative_speed
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_matched_Kummer_physical_repair_two_C1_jets
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_correction_remainder_locked_realized_atom
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_selected_repair_full_true_Hartree_feedback_and_H1_from_clock
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_moving_Kummer_outer_repair_full_PDE_next_locked_gain
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_real_Cramer_two_matrix_difference_bound
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Cramer_selected_frozen_Green_time_derivative
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_slice_clock_locked_relative_speed
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_matched_Kummer_physical_repair_two_C1_jets
          EOF
          lake env lean --trust=0 -DwarningAsError=true HBL213PhysicalProducersAudit.lean > evidence/audit.log 2>&1
          grep -q sorryAx evidence/audit.log && exit 1 || true
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          cp "$target" evidence/sources/HBL/TypeIIDynamicSelection/
          sha256sum "$target" > evidence/source-hashes.txt
          cp HBL213PhysicalProducersAudit.lean evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-physical-integration-audit
          path: evidence
          retention-days: 14
