name: HBL origin-gauge Kummer Green bridge
on:
  push:
    branches: [hbl-origin-green-20261029]
    paths:
      - 'HBL/KummerOriginGreen/**'
      - '.github/workflows/hbl-origin-green.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbl-origin-green-20261029
  cancel-in-progress: true

jobs:
  strict-origin-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: hbl-origin-green-new-20261029
          restore-keys: |
            hbl-noncompact-gradient-
      - name: Resolve exact pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Prefer full pinned Mathlib precompiled cache
        shell: bash
        run: |
          set -euo pipefail
          if lake exe cache get > evidence/full-mathlib-cache.log 2>&1; then
            echo "Full Mathlib cache restored"
          else
            echo "Full Mathlib cache unavailable; Lake will compile exact pinned source"
          fi
      - name: Restore verified base project cache when available
        id: hbl_project_cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-origin-green-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Strict build and full type and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,pathlib
          for path in pathlib.Path('HBL/KummerOriginGreen').glob('*.lean'):
            p=path.read_text()
            clean=re.sub(r'/\-.*?\-/','',p,flags=re.S)
            assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',clean),str(path)
          PY
          lake build HBL.KummerOriginGreen.GreenBridge HBL.KummerOriginGreen.UniformBound HBL.KummerOriginGreen.GreenTerminal HBL.KummerOriginGreen.GreenUnique HBL.KummerOriginGreen.GreenAudit HBL.KummerOriginGreen.UniformAudit HBL.KummerOriginGreen.TerminalAudit HBL.KummerOriginGreen.UniqueAudit HBL.KummerOriginGreen.SourceStability HBL.KummerOriginGreen.SourceStabilityAudit HBL.KummerOriginGreen.FrobeniusFirstJet HBL.KummerOriginGreen.FrobeniusFirstJetAudit HBL.KummerOriginGreen.FrobeniusThirdJet HBL.KummerOriginGreen.FrobeniusThirdJetAudit HBL.KummerOriginGreen.FrobeniusUniform HBL.KummerOriginGreen.FrobeniusUniformAudit HBL.KummerOriginGreen.FrobeniusParameterJets HBL.KummerOriginGreen.FrobeniusParameterJetsAudit 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/GreenBridge.lean 2>&1 | tee evidence/strict-source.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/UniformBound.lean 2>&1 | tee evidence/strict-uniform.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/GreenAudit.lean 2>&1 | tee evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/UniformAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/GreenTerminal.lean 2>&1 | tee evidence/strict-terminal.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/TerminalAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/GreenUnique.lean 2>&1 | tee evidence/strict-unique.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/UniqueAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/SourceStability.lean 2>&1 | tee evidence/strict-source-stability.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/SourceStabilityAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusFirstJet.lean 2>&1 | tee evidence/strict-frobenius-first.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusFirstJetAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusThirdJet.lean 2>&1 | tee evidence/strict-frobenius-third.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusThirdJetAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusUniform.lean 2>&1 | tee evidence/strict-frobenius-uniform.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusUniformAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusParameterJets.lean 2>&1 | tee evidence/strict-frobenius-jets.log
          lake env lean --trust=0 -DwarningAsError=true HBL/KummerOriginGreen/FrobeniusParameterJetsAudit.lean 2>&1 | tee -a evidence/types-and-axioms.txt
          ! grep -q sorryAx evidence/types-and-axioms.txt
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('evidence/types-and-axioms.txt').read_text()
          names=('originSingularFirstCoefficient_formula',
            'originSingularFirstCoefficient_indicial',
            'originFirstSingularResidual_exact',
            'originSingularFirstCoefficient_difference',
            'originSingularThirdCoefficient_indicial',
            'originThirdSingularResidual_exact',
            'originRegularSecondCoefficient_indicial',
            'originSecondRegularResidual_exact',
            'originThirdSingularResidual_norm',
            'originSecondRegularResidual_norm',
            'exists_compact_originFrobenius_residual_bound',
            'originFrobeniusCoefficientVector_contDiff',
            'compact_originFrobenius_all_parameter_jets_bounded',
            'originGreen_coefficients_add_smul',
            'originGreen_value_slope_add_smul',
            'originGreen_source_difference_bound',
            'exists_compact_originGreen_source_stability',
            'originGreen_homogeneous_coordinates_derivative',
            'originGreen_homogeneous_boundary_zero',
            'exists_compact_originGreen_outgoing_and_uniform',
            'originGreen_source_norm_le','originGreen_coefficients_norm_le',
            'originGreen_value_slope_norm_le','exists_compact_originGreen_value_slope_bound',
            'originGreenWronskian_exact','originGreenWronskian_ne',
            'originGreen_sources_continuous','originGreen_coefficients_hasDerivAt',
            'originGreenValue_hasDerivAt','originGreenSlope_hasDerivAt',
            'originGreen_equation','originGreen_endpoint_normalization',
            'originGreen_classical_outgoing')
          for n in names:
            if ('HBL.Profile.Kummer.'+n) not in s:
              raise SystemExit('Missing declaration: '+n)
          extras=set()
          for m in re.finditer(r"'[^']+' depends on axioms: \[([^\]]*)\]",s):
            extras.update(x.strip() for x in m.group(1).split(',') if x.strip())
          allowed={'propext','Classical.choice','Quot.sound'}
          assert extras <= allowed, extras-allowed
          print('PASS: supporting statements, transitive axiom check; manuscript 9/21')
          PY
      - name: Preserve source hashes and full diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum HBL/KummerOriginGreen/*.lean > evidence/origin-green-source-hashes.txt
      - name: Save source-indexed project build cache
        if: always() && steps.hbl_project_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-origin-green-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL/KummerOriginGreen/*.lean') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-origin-green-evidence
          path: evidence
          retention-days: 14
