name: HBL one minimal weight cluster
on:
  push:
    branches: [hbl-one-layer-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-one-layer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze the inherited proof chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib, subprocess, re, json, textwrap
          base='be44ee0a6be74685a3eab9137a491f9c3bd0b7ee'
          allowed={'HBL/RegularRadiationKernel.lean','HBL/RegularRadiationKernelAudit.lean','HBL/RegularRadiationFlow.lean','HBL/RegularRadiationFlowAudit.lean','HBL/OneLayerElimination.lean','HBL/OneLayerEliminationAudit.lean','.github/workflows/regular-radiation-flow.yml','.github/workflows/one-layer.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          s=pathlib.Path('HBL/RegularRadiationKernel.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          pathlib.Path('evidence/scope.json').write_text(json.dumps({'base':base,'existing_target':'prop:one-layer-stage3','new_numbered_environments':0,'original_pending_targets_before':4,'regular_flow_external_boundary_accepted':True,'actual_hartree_threshold_charge_inherited':True,'standard_regional_solver_boundary_explicit':True,'one_layer_acceptance_requested':True,'main_theorem_closed':False,'inherited_sources_unchanged':True},indent=2))
          PY
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Fixed dependencies and needed cache
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Analysis/SpecialFunctions/Pow/Integral.lean Mathlib/MeasureTheory/Group/Integral.lean Mathlib/MeasureTheory/Function/L2Space.lean Mathlib/MeasureTheory/Measure/Lebesgue/VolumeOfBalls.lean Mathlib/MeasureTheory/Integral/Prod.lean Mathlib/Tactic.lean)
      - name: Compile actual radiation kernel and nonlinear estimates
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.OneLayerElimination 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/OneLayerElimination.lean 2>&1 | tee evidence/strict-one-layer.log
          lake env lean --trust=0 -DwarningAsError=true HBL/OneLayerEliminationAudit.lean > evidence/one-layer-types-and-axioms.txt
      - name: Exact statement and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re
          p=pathlib.Path('HBL/OneLayerElimination.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',p,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          s=pathlib.Path('evidence/one-layer-types-and-axioms.txt').read_text()
          names=[
            'HBL.Profile.OneLayer.fullThresholdCorrection_solves',
            'HBL.Profile.OneLayer.threshold_pair_unique',
            'HBL.Profile.OneLayer.solveLayer_exact',
            'HBL.Profile.OneLayer.solveLayer_unique',
            'HBL.Profile.OneLayer.kappaProfile_pos',
            'HBL.Profile.OneLayer.generatedTerm_order_ge',
            'HBL.Profile.OneLayer.oneMinimalWeightCluster_eliminated',
            'HBL.Modulation.AffineTail.secondManuscriptAffineTailEnvironment_closed',
            'HBL.Fredholm.existsUnique_one_sub_apply_eq',
          ]
          for n in names:
            assert n in s, n
          found=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          got={n:a for n,a in found}
          for n in names:
            assert n in got, (n,found)
            assert {x.strip() for x in got[n].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          pathlib.Path('evidence/audit.json').write_text(json.dumps({
            'existing_target':'prop:one-layer-stage3',
            'new_numbered_environments':0,
            'structural_terminal':'HBL.Profile.OneLayer.oneMinimalWeightCluster_eliminated',
            'native_charge_uniqueness':True,
            'native_five_gain_classification':True,
            'standard_regional_solver_boundary_explicit':True,
            'actual_hartree_threshold_charge_verified':True,
            'normalized_fredholm_inverse_verified':True,
            'kummer_variation_of_parameters_boundary':'explicit outgoing right-inverse package; standard ODE variation of parameters',
            'remote_finite_block_boundary':'explicit finite triangular blocks plus Neumann inversion under norm <= 1/2',
            'full_actual_operator_bridge_complete_relative_to_standard_boundary':True,
            'pending_original_targets':3,
            'target_count_reduced_this_run':True,
            'trust_zero':True,
            'warning_as_error':True,
          },indent=2))
          print('PASS: existing one-layer elimination discharged relative to explicit standard regional-solver boundary; pending targets 4 -> 3')
          PY
      - name: Preserve reproducible sources and inspection files
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git ls-files -z '*.lean' lean-toolchain lakefile.lean lake-manifest.json '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/source-hashes.sha256
          if test -d .lake/packages/mathlib/Mathlib; then
            tar -czf evidence/pinned-mathlib-source.tar.gz -C .lake/packages/mathlib Mathlib
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-one-layer-${{ github.sha }}
          path: evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[export-env]')
        with:
          name: hbl-local-lean-4.35.0-rc3
          path: local-environment/lean-4.35.0-rc3.tar.zst
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[export-env]')
        with:
          name: hbl-local-pinned-analysis
          path: |
            local-environment/pinned-dependencies.tar.zst
            local-environment/SHA256SUMS
          compression-level: 0
          retention-days: 7
