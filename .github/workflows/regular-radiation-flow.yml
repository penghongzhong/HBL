name: HBL existing regular radiation flow
on:
  push:
    branches: [hbl-regular-radiation-flow-20261026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-radiation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze the inherited proof chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib, subprocess, re, json, textwrap
          base='be44ee0a6be74685a3eab9137a491f9c3bd0b7ee'
          allowed={'HBL/RegularRadiationKernel.lean','HBL/RegularRadiationKernelAudit.lean','.github/workflows/regular-radiation-flow.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          s=pathlib.Path('HBL/RegularRadiationKernel.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          pathlib.Path('evidence/scope.json').write_text(json.dumps({'base':base,'existing_target':'prop:regular-flow-stage3','new_numbered_environments':0,'original_pending_targets':5,'full_radiation_flow_verified':False,'main_theorem_closed':False,'actual_inverse_square_kernel':True,'actual_seventh_order_complex_nonlinearity':True,'nonlinear_estimate_order':0,'inherited_sources_unchanged':True},indent=2))
          PY
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Fixed dependencies and needed cache
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Analysis/SpecialFunctions/Pow/Integral.lean Mathlib/MeasureTheory/Group/Integral.lean Mathlib/MeasureTheory/Function/L2Space.lean Mathlib/MeasureTheory/Measure/Lebesgue/VolumeOfBalls.lean Mathlib/MeasureTheory/Integral/Prod.lean Mathlib/Tactic.lean)
      - name: Compile actual radiation kernel and nonlinear estimates
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.RegularRadiationKernel 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/RegularRadiationKernel.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/RegularRadiationKernelAudit.lean > evidence/types-and-axioms.txt
      - name: Exact statement and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re
          s=pathlib.Path('evidence/types-and-axioms.txt').read_text()
          names=['potential_bound','potential_sub_bound','quartic_difference','quartic_potential_bound','hartree_L2_bound','regularRadiationKernel_checks']
          expected=['HBL.RegularRadiation.'+n for n in names]
          found=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          assert [n for n,a in found]==expected
          for n,a in found:
            assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s and '⋯' not in s and '...' not in s
          pathlib.Path('evidence/audit.json').write_text(json.dumps({'declarations':found,'trust_zero':True,'warning_as_error':True,'complete_statement_types':True,'new_numbered_environments':0,'pending_original_targets':5,'full_regular_flow_accepted':False},indent=2))
          print('PASS: actual kernel and order-zero Hartree estimates; original PDE environment remains unaccepted')
          PY
      - name: Preserve reproducible sources and inspection files
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git ls-files -z '*.lean' lean-toolchain lakefile.lean lake-manifest.json '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/source-hashes.sha256
          if test -d .lake/packages/mathlib/Mathlib; then
            tar -czf evidence/pinned-mathlib-source.tar.gz -C .lake/packages/mathlib Mathlib
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-existing-radiation-${{ github.sha }}
          path: evidence
          retention-days: 14
