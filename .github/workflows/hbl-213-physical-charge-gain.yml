name: HBL 2.13 actual physical Hartree forced affine charge gain
on:
  push:
    branches: [hbl-213-ten-term-weighted-pointwise-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionChargeGain*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionInnerSolve*.lean'
      - '.github/workflows/hbl-213-physical-charge-gain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-physical-charge-gain-20261103
  cancel-in-progress: true
jobs:
  strict-charge-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          if ! lake exe cache get Mathlib.Tactic Mathlib.Analysis.SpecialFunctions.ImproperIntegrals > evidence/tactic-cache.log 2>&1; then
            echo 'Exact-source cache unavailable; all required modules must compile normally.'
          fi
          lean --version > evidence/compiler-version.txt
      - name: Restore same-branch physical source build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-physical-charge-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-physical-charge-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-physical-interaction-inner-solve-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-physical-full-weighted-L2-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict actual charge and inner correction audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          for n in ['ActualHartreePhysicalInteractionInnerSolve','ActualHartreePhysicalInteractionChargeGain']:
              source=Path('HBL/TypeIIDynamicSelection/'+n+'.lean').read_text()
              source=re.sub(r'/\-.*?\-/','',source,flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',source),n
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreePhysicalInteractionChargeGain HBL.TypeIIDynamicSelection.ActualHartreePhysicalInteractionChargeGainAudit 2>&1 | tee evidence/build.log
          for n in ActualHartreePhysicalInteractionInnerSolve ActualHartreePhysicalInteractionChargeGain; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/TypeIIDynamicSelection/${n}.lean" 2>&1 | tee "evidence/${n}-strict.log"
          done
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionChargeGainAudit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          for name in ['actual_Hartree_physical_interaction_inner_solve_from_radiation','actual_Hartree_physical_charge_tail_integrable','actual_Hartree_physical_interaction_forced_charges_one_eighth']:
              n='HBL.TypeIIDynamicSelection.'+name
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,'Missing transitive axioms: '+n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT ACTUAL CHARGE PASS: both forced affine resonance coefficients of the complete physical Hartree interaction retain ell^(1/8) smallness; unique inner correction comes from physical radiation data. Classical trace estimates, complete residual and coupled three-region matching remain OPEN. Revised manuscript count unchanged.')
          PY
      - name: Save same-branch build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-physical-charge-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionChargeGain*.lean HBL/TypeIIDynamicSelection/ActualHartreePhysicalInteractionInnerSolve*.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-physical-forced-charge-gain-audit
          path: evidence
          retention-days: 14
