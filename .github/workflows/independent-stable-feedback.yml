name: HBL independent stable and feedback proofs

on:
  push:
    branches: [hbl-independent-stable-feedback-20261025]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hbl-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: StableInitialPropagation
            audit: StableInitialAudit
            declaration: HBL.Shooting.stableInitialPropagation_certified
          - module: RetainedFeedbackTail
            audit: RetainedFeedbackAudit
            declaration: HBL.Modulation.TriangularRepair.retainedFeedbackTail_certified
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      PROOF_MODULE: ${{ matrix.module }}
      AUDIT_MODULE: ${{ matrix.audit }}
      TERMINAL_DECLARATION: ${{ matrix.declaration }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze accepted parent and enforce exact independent targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import subprocess,pathlib,textwrap,re,os,json
          base='ceefadda3046da04be84595634329a0e32bec512'
          permitted={'HBL/StableInitialPropagation.lean','HBL/StableInitialAudit.lean','HBL/RetainedFeedbackTail.lean','HBL/RetainedFeedbackAudit.lean','.github/workflows/independent-stable-feedback.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= permitted,delta-permitted
          for mod,decl in [('StableInitialPropagation','stableInitialPropagation_certified'),('RetainedFeedbackTail','retainedFeedbackTail_certified')]:
              s=pathlib.Path('HBL/'+mod+'.lean').read_text()
              s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',s)
              assert re.findall(r'^theorem (\w+)',s,re.M)==[decl]
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          pathlib.Path('evidence/scope.json').write_text(json.dumps({'base':base,'module':os.environ['PROOF_MODULE'],'original_acceptance':'8/21','baseline_changed':False,'target_only_audit':True},indent=2))
          print('Prior sources unchanged. Independent proof targets; no claim of full PDE or numbered environment closure.')
          PY
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: bash -euo pipefail /tmp/hbl-dependencies.sh
      - uses: actions/cache/restore@v4
        id: proof_cache
        with:
          path: .lake/build
          key: hbl-independent-${{ matrix.module }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-independent-${{ matrix.module }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Compile independent proof and its actual dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.$PROOF_MODULE 2>&1 | tee evidence/build.log
      - name: Strict kernel check and complete type
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 -DwarningAsError=true HBL/$PROOF_MODULE.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/$AUDIT_MODULE.lean > evidence/types-and-axioms.txt
          git ls-files -z '*.lean' lean-toolchain lake-manifest.json lakefile.lean '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/all-sources.sha256
      - name: Verify exact terminal inventory and transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,pathlib,os
          s=pathlib.Path('evidence/types-and-axioms.txt').read_text()
          expected=os.environ['TERMINAL_DECLARATION']
          reports=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          assert len(reports)==1 and reports[0][0]==expected,reports
          axioms={x.strip() for x in reports[0][1].split(',') if x.strip()}
          assert axioms <= {'propext','Classical.choice','Quot.sound'},axioms
          assert 'sorryAx' not in s and '⋯' not in s and '...' not in s
          pathlib.Path('evidence/audit.json').write_text(json.dumps({'declaration':expected,'axioms':sorted(axioms),'trust_zero':True,'warning_as_error':True,'untruncated_type':True,'original_acceptance':'8/21','physical_spectral_or_residual_identification':False},indent=2))
          print('PASS:',expected,'axioms:',sorted(axioms))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-independent-${{ matrix.module }}-${{ github.sha }}
          path: |
            evidence
            HBL/StableInitialPropagation.lean
            HBL/StableInitialAudit.lean
            HBL/RetainedFeedbackTail.lean
            HBL/RetainedFeedbackAudit.lean
            .github/workflows/independent-stable-feedback.yml
          include-hidden-files: true
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.proof_cache.outputs.cache-hit != 'true'
        with:
          path: .lake/build
          key: ${{ steps.proof_cache.outputs.cache-primary-key }}
