name: HBL reusable source inventory
on:
  workflow_dispatch:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths: ['.github/workflows/hbl-reuse-source-inventory.yml']
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: hbl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: a98628e16c11f5167f16124105ddce53efa9bfe5
          path: mathlib
          persist-credentials: false
      - name: Index explicit source declarations and direct imports
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          def mask(text):
              out=list(text); i=0; depth=0; quoted=False
              while i<len(text):
                  if depth:
                      if text.startswith('/-',i): out[i:i+2]='  '; depth+=1; i+=2
                      elif text.startswith('-/',i): out[i:i+2]='  '; depth-=1; i+=2
                      else:
                          if text[i]!='\n': out[i]=' '
                          i+=1
                  elif quoted:
                      if text[i]=='\\' and i+1<len(text):
                          out[i]=' '
                          if text[i+1]!='\n': out[i+1]=' '
                          i+=2
                      else:
                          if text[i]=='"': quoted=False
                          if text[i]!='\n': out[i]=' '
                          i+=1
                  elif text.startswith('/-',i): out[i:i+2]='  '; depth=1; i+=2
                  elif text.startswith('--',i):
                      j=text.find('\n',i)
                      if j<0: j=len(text)
                      out[i:j]=' '*(j-i); i=j
                  elif text[i]=='"': out[i]=' '; quoted=True; i+=1
                  else: i+=1
              return ''.join(out)
          decl=re.compile(r'^\s*(?:(?:public|private|protected|noncomputable|unsafe|partial)\s+)*(theorem|lemma|def|abbrev|structure|class|axiom|opaque|inductive)\s+([^\s(:{\[]+)',re.M)
          imp=re.compile(r'^\s*(?:public\s+|meta\s+)?import\s+([^\n]+)',re.M)
          summary={'notice':'SOURCE INVENTORY ONLY. No Lean build, axiom audit or manuscript acceptance is claimed. Explicit source declarations only; generated declarations are absent. Header previews are not elaborated types.', 'pools':{}}
          with Path('evidence/index.jsonl').open('w') as out:
              for pool, subtree in [('hbl','HBL'),('mathlib','Mathlib')]:
                  root=Path(pool)
                  sha=subprocess.check_output(['git','-C',pool,'rev-parse','HEAD'],text=True).strip()
                  tc=(root/'lean-toolchain').read_text().strip()
                  count=total=0
                  for path in sorted((root/subtree).rglob('*.lean')):
                      raw=path.read_bytes(); text=raw.decode('utf-8'); clean=mask(text)
                      entries=[]
                      for m in decl.finditer(clean):
                          start=m.start(1); end=min(len(text),start+1600)
                          eq=clean.find(':=',start,end)
                          if eq>=0: end=eq
                          entries.append({'kind':m.group(1),'name':m.group(2),'line':text.count('\n',0,start)+1,'header_preview':text[start:end].strip()})
                      rel=path.relative_to(root)
                      row={'pool':pool,'commit':sha,'toolchain':tc,'path':rel.as_posix(),'module':'.'.join(rel.with_suffix('').parts),'sha256':hashlib.sha256(raw).hexdigest(),'imports':[w for m in imp.finditer(clean) for w in m.group(1).split()],'declarations':entries,'warning_tokens':sorted(set(re.findall(r'\b(?:sorry|admit|axiom|unsafe|native_decide)\b',clean))),'status':'SOURCE_CANDIDATE_NOT_VERIFIED'}
                      out.write(json.dumps(row,ensure_ascii=False)+'\n'); count+=1; total+=len(entries)
                  summary['pools'][pool]={'commit':sha,'toolchain':tc,'source_files':count,'explicit_declarations':total}
          Path('evidence/index.summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Archive public source bytes for offline reuse
        run: |
          set -euo pipefail
          tar -czf evidence/sources.tar.gz hbl/HBL hbl/lean-toolchain hbl/lake-manifest.json mathlib/Mathlib mathlib/lean-toolchain mathlib/LICENSE
          cp hbl/.github/workflows/hbl-reuse-source-inventory.yml evidence/
          sha256sum evidence/index.jsonl evidence/sources.tar.gz > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hbl-mathlib-source-reuse-index
          path: evidence
          retention-days: 30
