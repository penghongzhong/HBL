name: HBL exact original Hartree moving mass-phase jet algebra strict
on:
  push:
    branches: [hbl-213-spectral-c1-trace-20261109]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeRenormalizedMassPhaseFluxAlgebra.lean'
      - '.github/workflows/hbl-213-actual-hartree-moving-mass-phase-algebra.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-locked-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-true-onephysical-kummer-quadratic-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-realized-atlas-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-kummer-atom-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict actual same-source Hartree moving mass-phase jet algebra audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeRenormalizedMassPhaseFluxAlgebra.lean
          module=HBL.TypeIIDynamicSelection.ActualHartreeRenormalizedMassPhaseFluxAlgebra
          lake build "$module" > evidence/build.log 2>&1 || { tail -260 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > ActualHartreeRenormalizedMassPhaseFluxAlgebraAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeRenormalizedMassPhaseFluxAlgebra
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_local_mass_phase_current_splits
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_local_mass_phase_current_splits
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_renormalized_bare_scaling_phase_mass_jet_cancels
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_renormalized_bare_scaling_phase_mass_jet_cancels
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_same_orbit_phase_mass_source_cancels
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_same_orbit_phase_mass_source_cancels
          EOF
          lake env lean --trust=0 -DwarningAsError=true ActualHartreeRenormalizedMassPhaseFluxAlgebraAudit.lean > evidence/audit.log 2>&1 || { cat evidence/audit.log; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path('evidence/audit.log').read_text()
          targets=[
              'HBL.TypeIIDynamicSelection.actual_Hartree_local_mass_phase_current_splits',
              'HBL.TypeIIDynamicSelection.actual_Hartree_renormalized_bare_scaling_phase_mass_jet_cancels',
              'HBL.TypeIIDynamicSelection.actual_Hartree_same_orbit_phase_mass_source_cancels',
          ]
          assert all(t in data for t in targets), 'Missing exact theorem #check'
          assert 'sorryAx' not in data and 'admit' not in data, 'Forbidden proof axiom'
          reports=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',data)
          empty=re.findall(r'does not depend on any axioms',data)
          assert len(reports)+len(empty)==len(targets),f'Expected {len(targets)} axiom reports, got {len(reports)+len(empty)}'
          actual={x.strip() for report in reports for x in report.split(',') if x.strip()}
          allowed={'propext','Classical.choice','Quot.sound'}
          assert actual <= allowed, f'Unexpected axioms: {actual-allowed}'
          print('Exact pinned trust-zero moving original Hartree phase-mass jet algebra; axioms:',sorted(actual))
          PY
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          cp "$target" evidence/sources/HBL/TypeIIDynamicSelection/
          sha256sum "$target" > evidence/source-hashes.txt
          cp ActualHartreeRenormalizedMassPhaseFluxAlgebraAudit.lean evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-original-hartree-moving-phase-mass-algebra-evidence
          path: evidence
          retention-days: 14
