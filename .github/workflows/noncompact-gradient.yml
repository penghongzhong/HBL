name: HBL full first-order quadratic remainder
on:
  push:
    branches: [hbl-noncompact-gradient-20261028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install hash-pinned compiler
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 3 -fL \
              https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c - | tee evidence/compiler-archive-check.txt
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          compiler="$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin"
          "$compiler/lean" --version | tee evidence/compiler.txt
          grep -F '4.35.0-rc3' evidence/compiler.txt
          grep -F 'v4.35.0-rc3' lean-toolchain
          echo "$compiler" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .lake
          key: hbl-noncompact-gradient-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-noncompact-gradient-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-retained-repair-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/Analysis/Calculus/UniformLimitsDeriv.lean Mathlib/Analysis/Calculus/ContDiff/Convolution.lean Mathlib/Analysis/InnerProductSpace/Calculus.lean) >> evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Compile whole remainder and audit all terminal types
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile verification/remainder_first_order_validation.py
          python3 verification/remainder_first_order_validation.py
      - name: Preserve actual compiler and audit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f verification/remainder-first-order-current-status.json; then
            git add verification/remainder-first-order-current-status.json verification/remainder-first-order-current-errors.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record full first-order remainder compiler and axiom audit [skip ci]'
              git push origin HEAD:hbl-noncompact-gradient-20261028
            fi
          fi
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git diff 5e1ef8f6075cacc54ef4aae0bc1dc83ea2a1cde8 HEAD > evidence/remainder-first-order.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-remainder-first-order-${{ github.sha }}
          path: evidence
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Require strict success and retained-chain regression
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('verification/remainder-first-order-current-status.json'))
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['validation_passed'],r
          PY
