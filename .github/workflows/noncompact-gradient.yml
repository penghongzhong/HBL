name: HBL noncompact gradient completion
on:
  push:
    branches: [hbl-noncompact-gradient-20261028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version > evidence/compiler.txt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .lake
          key: hbl-noncompact-gradient-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-noncompact-gradient-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-retained-repair-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/Analysis/Calculus/UniformLimitsDeriv.lean Mathlib/Analysis/Calculus/ContDiff/Convolution.lean Mathlib/Analysis/InnerProductSpace/Calculus.lean) >> evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Actual source compilation and complete declaration audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,json,hashlib,os
          baseline='027bb49f5ccbbefbf466b7c54dc31ea390f602fa'
          names=['gradientPotential','gradientPotential_bound','gradientPotential_apply','gradientPotential_difference_bound','potential_core_gradient','potential_hasFDerivAt_of_core_approximation']
          full=['HBL.RegularRadiation.SpatialCompletion.'+n for n in names]
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'baseline':baseline,'main_theorem_closed':False,'new_original_environments_verified':0,'full_paper_percentage_recertified':False,'validation_passed':False,'boundary':'The limiting density and gradient need not have compact support. L1 and essential-supremum approximation by compact C1 densities remains an explicit source-class obligation. No actual constrained Hartree propagator or nonlinear Sobolev-flow theorem is asserted.'}
          errors={}
          def run(cmd,filename):
            p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            Path('evidence/'+filename).write_text(p.stdout)
            lines=p.stdout.splitlines(); blocks=[]; active=[]
            for line in lines:
              if re.match(r'(?:error|warning|info): ',line) or re.match(r'HBL/.*: (?:error|warning):',line) or line.startswith('trace:') or ' Built ' in line or ' Building ' in line:
                if active: blocks.append('\n'.join(active)); active=[]
                if ('error:' in line or 'warning:' in line) and 'HBL/HartreeSpatial' in line: active=[line]
              elif active: active.append(line)
            if active: blocks.append('\n'.join(active))
            if p.returncode and not blocks: blocks=[p.stdout[-12000:]]
            if blocks: errors[filename]='\n\n'.join(blocks)
            return p.returncode,p.stdout
          src=Path('HBL/HartreeSpatialCompletion.lean').read_text()
          assert re.findall(r'^(?:def|theorem) (\w+)',src,re.M)==names
          report['source_sha256']=hashlib.sha256(src.encode()).hexdigest()
          preserved=[]
          for p in subprocess.check_output(['git','ls-tree','-r','--name-only',baseline],text=True).splitlines():
            if not p.endswith('.lean'): continue
            assert Path(p).read_bytes()==subprocess.check_output(['git','show',baseline+':'+p]),p
            preserved.append(p)
          report['baseline_Lean_sources_byte_identical']=len(preserved)
          removed=[]
          for module in ['HartreeSpatialCore','HartreeSpatialCompletion']:
            for p in Path('.lake/build').rglob(module+'.*'):
              if p.is_file(): removed.append(str(p)); p.unlink()
          report['target_cached_files_removed']=removed
          build,_=run(['lake','build','HBL.HartreeSpatialCompletion'],'completion-build.log')
          report['build_exit']=build
          if build==0:
            core,_=run(['lake','env','lean','--trust=0','-DwarningAsError=true','HBL/HartreeSpatialCore.lean'],'core-strict.log')
            strict,_=run(['lake','env','lean','--trust=0','-DwarningAsError=true','HBL/HartreeSpatialCompletion.lean'],'completion-strict.log')
            report['core_strict_exit']=core; report['completion_strict_exit']=strict
            if core==0 and strict==0:
              audit='import HBL.HartreeSpatialCompletion\nset_option pp.all true\nset_option pp.maxSteps 10000000\nset_option maxRecDepth 1000000\n'
              audit+='\n'.join('#check @'+n for n in full)+'\n'
              audit+='\n'.join('set_option pp.all false in\n#print axioms '+n for n in full)+'\n'
              Path('evidence/CompletionAudit.lean').write_text(audit)
              ae,out=run(['lake','env','lean','--trust=0','-DwarningAsError=true','evidence/CompletionAudit.lean'],'complete-types-and-axioms.txt')
              matches=[(m.group(1),m.group(2) or '') for m in re.finditer(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",out,re.S)]
              allowed={'propext','Classical.choice','Quot.sound'}
              ok=ae==0 and [n for n,_ in matches]==full and not any(x in out for x in ['sorryAx','⋯','...'])
              ok=ok and all({x.strip() for x in axs.split(',') if x.strip()}<=allowed for _,axs in matches)
              ok=ok and not re.search(r'\b(sorry|admit|axiom|unsafe)\b',src)
              report['axioms']={n:[x.strip() for x in axs.split(',') if x.strip()] for n,axs in matches}
              report['audited_declarations']=full
              report['audit_passed']=bool(ok)
              report['validation_passed']=bool(ok)
          Path('verification/noncompact-gradient-current-status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          Path('verification/noncompact-gradient-current-errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2)+'\n')
          Path('evidence/status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(errors,ensure_ascii=False,indent=2))
          PY
      - name: Preserve diagnostics without editing proof sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f verification/noncompact-gradient-current-status.json; then
            git add verification/noncompact-gradient-current-status.json verification/noncompact-gradient-current-errors.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record noncompact-gradient compiler and axiom audit [skip ci]'
              git push origin HEAD:hbl-noncompact-gradient-20261028
            fi
          fi
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git diff 027bb49f5ccbbefbf466b7c54dc31ea390f602fa HEAD > evidence/completion.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-noncompact-gradient-${{ github.sha }}
          path: evidence
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Require actual strict success
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('verification/noncompact-gradient-current-status.json'))
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['validation_passed'],r
          PY
