name: HBL physical Kummer interface repair strict
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualKummerInterfaceRepair.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerPhysicalInterfaceRepair.lean'
      - '.github/workflows/hbl-kummer-physical-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - name: Strict physical repair audit
        shell: bash
        run: |
          set -euo pipefail
          files='HBL/TypeIIDynamicSelection/ActualKummerInterfaceRepair.lean HBL/TypeIIDynamicSelection/ActualKummerPhysicalInterfaceRepair.lean'
          modules='HBL.TypeIIDynamicSelection.ActualKummerInterfaceRepair HBL.TypeIIDynamicSelection.ActualKummerPhysicalInterfaceRepair'
          lake build $modules > evidence/build.log 2>&1 || { tail -220 evidence/build.log; exit 1; }
          for f in $files; do
            o="evidence/$(basename "$f" .lean)-strict.log"
            lake env lean --trust=0 -DwarningAsError=true "$f" > "$o" 2>&1 || { cat "$o"; exit 1; }
            test ! -s "$o"
          done
          cat > RepairAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualKummerPhysicalInterfaceRepair
          set_option pp.all true
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_interface_repair_positive_radius_bound
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_derivatives
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_scaled_residual_exact
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_endpoint_jets
          #check @HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_residual_bound
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_interface_repair_positive_radius_bound
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_scaled_residual_exact
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Kummer_physical_interface_repair_residual_bound
          EOF
          lake env lean --trust=0 -DwarningAsError=true RepairAudit.lean > evidence/audit.log 2>&1
          grep -q 'sorryAx' evidence/audit.log && exit 1 || true
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          for f in $files; do sha256sum "$f" >> evidence/source-hashes.txt; cp "$f" evidence/sources/HBL/TypeIIDynamicSelection/; done
          cp RepairAudit.lean evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-kummer-physical-repair-audit
          path: evidence
          retention-days: 14
