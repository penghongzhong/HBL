name: HBL R13 physical energy surjectivity
on:
  push:
    branches: [hbl-physical-energy-surjective-20261026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-physical-surjective-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze R12 and enforce a single complete environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib,subprocess,textwrap,re,json
          base='ee41e672b7a06d42046b6b544e0e3439fc89ac0d'
          allowed={'HBL/PhysicalEnergySurjective.lean','HBL/PhysicalEnergySurjectiveAudit.lean','.github/workflows/physical-energy-surjective.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          s=pathlib.Path('HBL/PhysicalEnergySurjective.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          assert re.findall(r'^theorem (\w+)',clean,re.M)==['physicalEnergySurjective_certified']
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          pathlib.Path('evidence/scope.json').write_text(json.dumps({'base':base,'new_environment':'R13','onto_physical_completion_coordinate':True,'inverse_constructed_not_assumed':True,'L6_weak_derivative_realization_proved':False,'three_dimensional_nonlocal_identity_proved':False,'Hamilton_evolution_proved':False,'parent_sources_unchanged':True,'main_theorem_closed':False},indent=2))
          PY
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies and test-function cache
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          lake exe cache get Mathlib/Analysis/Distribution/AEEqOfIntegralContDiff.lean
      - uses: actions/cache/restore@v4
        id: proof_cache
        with:
          path: .lake/build
          key: hbl-physical-surjective-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-physical-surjective-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-physical-completion-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-environment-ledger-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Compile actual onto theorem and inherited environments
        shell: bash
        run: |
          set -euo pipefail
          modules=$(sed -n 's/^import //p' HBL/CurrentEnvironmentAudit.lean | tr '\n' ' ')
          lake build HBL.PhysicalEnergySurjective $modules 2>&1 | tee evidence/build.log
      - name: Strict kernel checks and complete statement types
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 -DwarningAsError=true HBL/PhysicalEnergySurjective.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/CurrentEnvironmentAudit.lean > evidence/prior-types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/PhysicalEnergyCompletionAudit.lean > evidence/r12-types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/PhysicalEnergySurjectiveAudit.lean > evidence/new-type-and-axioms.txt
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git ls-files -z '*.lean' lean-toolchain lake-manifest.json lakefile.lean '.github/workflows/*.yml' 'verification/*.json' | xargs -0 sha256sum > evidence/all-sources.sha256
      - name: Audit one new and twenty-one inherited terminals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,re
          m=json.loads(pathlib.Path('verification/current-environments-20261026.json').read_text())
          expected=[t for e in m['environments'] if e['status']=='registered_accepted' for t in e['terminals']]+['HBL.Modulation.Monopole.physicalEnergyCompletion_certified','HBL.Modulation.Monopole.physicalEnergySurjective_certified']
          s='\n'.join(pathlib.Path('evidence/'+p).read_text() for p in ['prior-types-and-axioms.txt','r12-types-and-axioms.txt','new-type-and-axioms.txt'])
          reports=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          assert [r[0] for r in reports]==expected,[r[0] for r in reports]
          inventory=[]
          for name,raw in reports:
              axioms={x.strip() for x in raw.split(',') if x.strip()}
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
              inventory.append({'declaration':name,'axioms':sorted(axioms)})
          assert 'sorryAx' not in s and '⋯' not in s and '...' not in s
          pathlib.Path('evidence/audit.json').write_text(json.dumps({'declarations':inventory,'trust_zero':True,'warning_as_error':True,'complete_statement_types':True,'new_environments':1,'prior_environments':20,'accepted_current_environments':21,'current_named_total_after_sync':26,'main_theorem_closed':False,'coverage_is_not_main_chain_completion':True},indent=2))
          print('PASS: 22 terminal declarations; one complete R13 onto environment')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-physical-surjective-${{ github.sha }}
          path: |
            evidence
            HBL/PhysicalEnergySurjective.lean
            HBL/PhysicalEnergySurjectiveAudit.lean
            .github/workflows/physical-energy-surjective.yml
          include-hidden-files: true
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.proof_cache.outputs.cache-hit != 'true'
        with:
          path: .lake/build
          key: ${{ steps.proof_cache.outputs.cache-primary-key }}
