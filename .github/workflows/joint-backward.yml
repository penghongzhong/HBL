name: HBL joint backward contraction
on:
  push:
    branches: [hbl-main-theorem-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-joint-backward-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze inherited chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib, subprocess, re, textwrap
          base='aa38439a818d7acddfac87af6158d7d6fcff10fb'
          allowed={'HBL/JointBackwardContraction.lean','.github/workflows/joint-backward.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          p=pathlib.Path('HBL/JointBackwardContraction.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',p,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Fixed dependencies
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Topology/MetricSpace/Contracting.lean)
      - name: Compile and audit
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.JointBackwardContraction 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/JointBackwardContraction.lean 2>&1 | tee evidence/strict.log
          grep -q "HBL.MainBackward.two_stage_backward_fixed_point.*depends on axioms" evidence/strict.log
          ! grep -q "sorryAx" evidence/strict.log
          echo "PASS: generic two-stage backward contraction"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-joint-backward-${{ github.sha }}
          path: evidence
          retention-days: 14
