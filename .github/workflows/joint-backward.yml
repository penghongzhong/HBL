name: HBL joint backward contraction
on:
  push:
    branches: [hbl-main-theorem-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-joint-backward-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze inherited chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib, subprocess, re, textwrap
          base='aa38439a818d7acddfac87af6158d7d6fcff10fb'
          allowed={'HBL/JointBackwardContraction.lean','HBL/PropagatedFeedbackTail.lean','HBL/CenterEvolutionBoundary.lean','HBL/CenterDuhamelEstimates.lean','HBL/FiniteProfileResidualLedger.lean','HBL/ResidualDecayFromFiniteAtoms.lean','HBL/ConstrainedCenterSpace.lean','HBL/WeightedBackwardPaths.lean','HBL/WeightedThresholdMap.lean','HBL/WeightedCenterFeedbackMap.lean','HBL/WeightedCenterNonlinearMap.lean','HBL/WeightedJointBackward.lean','HBL/CenterCoercivity.lean','HBL/ResidualDecayFromLipschitz.lean','HBL/MainBackwardAudit.lean','HBL/MainRateSelection.lean','HBL/BlowupNonextension.lean','HBL/ParametricFixedPointC1.lean','.github/workflows/joint-backward.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          p=pathlib.Path('HBL/JointBackwardContraction.lean').read_text()
          clean=re.sub(r'/\-.*?\-/','',p,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Fixed dependencies
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Topology/MetricSpace/Contracting.lean)
      - name: Compile and audit
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.JointBackwardContraction HBL.PropagatedFeedbackTail HBL.CenterEvolutionBoundary HBL.CenterDuhamelEstimates HBL.FiniteProfileResidualLedger HBL.ResidualDecayFromFiniteAtoms HBL.ConstrainedCenterSpace HBL.WeightedBackwardPaths HBL.WeightedThresholdMap HBL.WeightedCenterFeedbackMap HBL.WeightedCenterNonlinearMap HBL.WeightedJointBackward HBL.CenterCoercivity HBL.ResidualDecayFromLipschitz HBL.MainBackwardAudit HBL.MainRateSelection HBL.BlowupNonextension HBL.ParametricFixedPointC1 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/JointBackwardContraction.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/PropagatedFeedbackTail.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/CenterEvolutionBoundary.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/CenterDuhamelEstimates.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/FiniteProfileResidualLedger.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/ResidualDecayFromFiniteAtoms.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/ConstrainedCenterSpace.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedBackwardPaths.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedThresholdMap.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedCenterFeedbackMap.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedCenterNonlinearMap.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedCenterNonlinearMap.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedJointBackward.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/CenterCoercivity.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/ResidualDecayFromLipschitz.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/MainBackwardAudit.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/MainRateSelection.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/BlowupNonextension.lean 2>&1 | tee -a evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/ParametricFixedPointC1.lean 2>&1 | tee -a evidence/strict.log
          grep -q "HBL.MainBackward.two_stage_backward_fixed_point.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.propagatedFeedbackTail_difference_weighted.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.standardCenter_feedback_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.propagatedNonlinearTail_difference_weighted.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.propagatedProfileForcing_weighted.*depends on axioms" evidence/strict.log
          grep -q "HBL.Profile.ResidualLedger.residualSum_bound_of_orders.*depends on axioms" evidence/strict.log
          grep -q "HBL.Profile.ResidualLedger.parametricResidualSum_eventually_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.retained_feedback_bound_from_finite_atoms.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.constrainedCenter_moving_coercive.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.unweightThresholdPath_difference_bound.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.weightedThresholdMap_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.weightedCenterFeedbackMap_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.weightedCenterNonlinearMap_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.weightedCenterNonlinearMap_lipschitz.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.nonlinear_weighted_joint_backward_fixed_point.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.weighted_joint_backward_fixed_point.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.center_coercive_under_small_form_perturbation.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.retained_feedback_coefficient_bound_from_residual.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.selectedPhysicalRate_eq_two_iff.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.no_strong_limit_of_separated_profile.*depends on axioms" evidence/strict.log
          grep -q "HBL.MainBackward.contracting_fixed_point_has_C1_local_graph.*depends on axioms" evidence/strict.log
          ! grep -q "sorryAx" evidence/strict.log
          echo "PASS: generic two-stage backward contraction plus propagated feedback gain"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-joint-backward-${{ github.sha }}
          path: evidence
          retention-days: 14
