name: HBL 2.13 moment-locked physical sources and coupled inner response
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedSpeed*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjection*.lean'
      - 'HBL/InnerEstimates/OutputLinearity.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedInnerResponse*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibility*.lean'
      - 'HBL/TypeIIDynamicSelection/ComplexTwoColumnDeterminantBound.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseTraceBound.lean'
      - 'HBL/KummerOriginBasis/RegularDerivativeBound.lean'
      - 'HBL/KummerOriginBasis/ReferenceIntegralLowerBound.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseMomentGrowth.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjectionAsymptotics.lean'
      - 'HBL/TypeIIDynamicSelection/CoupledSmallParameterRegion.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledDeterminantBound.lean'
      - '.github/workflows/hbl-213-moment-locked-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-moment-locked-projection-20261104
  cancel-in-progress: true
jobs:
  strict-moment-locked-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install identical pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve identical pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || echo 'Mandatory exact-source build follows.'
          lean --version > evidence/compiler-version.txt
      - name: Restore accepted accumulated proof pool
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-moment-locked-speed-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-finite-rank-transmission-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-canonical-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict physical source and coupled inner response kernel audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          for n in ['ActualHartreeMomentLockedSpeed','ActualHartreeMomentLockedProjection']:
              s=re.sub(r'/\-.*?\-/','',Path('HBL/TypeIIDynamicSelection/'+n+'.lean').read_text(),flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s),n
          sources=[
              ('HBL.Modulation.Monopole','HBL/InnerEstimates/OutputLinearity.lean'),
              ('HBL.TypeIIDynamicSelection','HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedInnerResponse.lean'),
              ('HBL.TypeIIDynamicSelection','HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibility.lean'),
              ('HBL.TypeIIDynamicSelection','HBL/TypeIIDynamicSelection/ComplexTwoColumnDeterminantBound.lean'),
              ('HBL.TypeIIDynamicSelection','HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseTraceBound.lean'),
              ('HBL.Profile.Kummer','HBL/KummerOriginBasis/RegularDerivativeBound.lean'),
              ('HBL.Profile.Kummer','HBL/KummerOriginBasis/ReferenceIntegralLowerBound.lean'),
          ]
          names=[]
          for ns,p in sources:
              s=re.sub(r'/\-.*?\-/','',Path(p).read_text(),flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s),p
              names.extend(ns+'.'+n for n in re.findall(r"^theorem\s+([A-Za-z_][A-Za-z_0-9']*)",s,flags=re.M))
          new_projection=['actual_Hartree_moment_locked_scaled_speed_integrable_on','actual_moment_locked_source_coefficient_add_mul_on']
          projection=Path('HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjection.lean').read_text()
          for n in new_projection:
              assert re.search(r'^theorem\s+'+re.escape(n)+r'\b',projection,flags=re.M),n
              names.append('HBL.TypeIIDynamicSelection.'+n)
          assert names and len(names)==len(set(names))
          audit=Path('HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibilityAudit.lean').read_text()
          assert set(re.findall(r'^#check\s+@(\S+)',audit,flags=re.M))==set(names)
          assert set(re.findall(r'^#print axioms\s+(\S+)',audit,flags=re.M))==set(names)
          Path('evidence/new-public-declarations.txt').write_text('\n'.join(names)+'\n')
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedProjection HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedProjectionAudit HBL.InnerEstimates.OutputLinearity HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedInnerResponse HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedCoupledCompatibility HBL.TypeIIDynamicSelection.ComplexTwoColumnDeterminantBound HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedResponseTraceBound HBL.KummerOriginBasis.RegularDerivativeBound HBL.KummerOriginBasis.ReferenceIntegralLowerBound HBL.TypeIIDynamicSelection.ActualHartreeMomentLockedCoupledCompatibilityAudit 2>&1 | tee evidence/build.log
          for p in HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedSpeed.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjection.lean HBL/InnerEstimates/OutputLinearity.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedInnerResponse.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibility.lean HBL/TypeIIDynamicSelection/ComplexTwoColumnDeterminantBound.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseTraceBound.lean HBL/KummerOriginBasis/RegularDerivativeBound.lean HBL/KummerOriginBasis/ReferenceIntegralLowerBound.lean; do
            n="${p##*/}"
            lake env lean --trust=0 -DwarningAsError=true "$p" 2>&1 | tee "evidence/${n%.lean}-strict.log"
          done
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjectionAudit.lean 2>&1 | tee evidence/audit.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibilityAudit.lean 2>&1 | tee evidence/coupled-response-audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          names=['actual_Hartree_threeD_moment_core_speed_split','actual_Hartree_moment_locked_speed_profiles_uniform_close','actual_Hartree_moment_locked_scaled_speed_integrable','actual_Hartree_moment_locked_projection_columns_close','actual_Hartree_moment_locked_compatibility_speed_response']
          for v in names:
              n='HBL.TypeIIDynamicSelection.'+v
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT ACTUAL SPEED PROJECTION PASS: true moment-locked scale and phase source directions, derived annular integrability, exact real-speed compatibility response and O(c) convergence to explicit bubble columns. Reference determinant nondegeneracy, coupled trajectory and manuscript 2.13 remain OPEN.')
          s=Path('evidence/coupled-response-audit.log').read_text()
          names=Path('evidence/new-public-declarations.txt').read_text().splitlines()
          for n in names:
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          assert not re.search(r'\.\.\.|⋯|…',s),'Truncated declaration output'
          print('STRICT COUPLED INNER RESPONSE PASS:',len(names),'public declarations; actual normalized Fredholm linearity, physical source responses, physical traces, and full fixed-configuration compatibility columns. Determinant nondegeneracy, relative residual gain and manuscript 2.13 remain OPEN.')
          PY
      - name: Save accumulated proof pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/sources
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedSpeed*.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjection*.lean HBL/InnerEstimates/OutputLinearity.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedInnerResponse.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibility*.lean HBL/TypeIIDynamicSelection/ComplexTwoColumnDeterminantBound.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseTraceBound.lean HBL/KummerOriginBasis/RegularDerivativeBound.lean HBL/KummerOriginBasis/ReferenceIntegralLowerBound.lean > evidence/source-hashes.txt
          cp HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedSpeed*.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedProjection*.lean HBL/InnerEstimates/OutputLinearity.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedInnerResponse.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedCoupledCompatibility*.lean HBL/TypeIIDynamicSelection/ComplexTwoColumnDeterminantBound.lean HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedResponseTraceBound.lean HBL/KummerOriginBasis/RegularDerivativeBound.lean HBL/KummerOriginBasis/ReferenceIntegralLowerBound.lean evidence/sources/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-moment-locked-projection-audit
          path: evidence
          retention-days: 14
