name: HBL original mixed quartic half radial velocity Riesz strict
on:
  push:
    branches: [hbl-213-spectral-c1-trace-20261109]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMixedHalfRadialVelocityTimeRiesz.lean'
      - '.github/workflows/hbl-213-mixed-half-radial-velocity-Riesz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-locked-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-true-mixed-half-radial-riesz-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-realized-atlas-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-kummer-atom-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict locked physical gain audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeMixedHalfRadialVelocityTimeRiesz.lean
          module=HBL.TypeIIDynamicSelection.ActualHartreeMixedHalfRadialVelocityTimeRiesz
          lake build "$module" > evidence/build.log 2>&1 || { tail -260 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > HartreeMixedHalfRadialRieszAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeMixedHalfRadialVelocityTimeRiesz
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_original_mixed_quartic_velocity_half_radial
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_mixed_Riesz_time_uniform_from_half_radial_orbit
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_original_mixed_quartic_velocity_half_radial
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_mixed_Riesz_time_uniform_from_half_radial_orbit
          EOF
          lake env lean --trust=0 -DwarningAsError=true HartreeMixedHalfRadialRieszAudit.lean > evidence/audit.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('evidence/audit.log').read_text()
          targets=["HBL.TypeIIDynamicSelection.actual_Hartree_original_mixed_quartic_velocity_half_radial","HBL.TypeIIDynamicSelection.actual_Hartree_mixed_Riesz_time_uniform_from_half_radial_orbit"]
          assert all(v in s for v in targets), 'missing exact #check'
          assert 'sorryAx' not in s and 'admit' not in s
          audits=re.findall(r'depends on axioms:\s*\[([^\]]*)\]', s)
          assert len(audits)==2, f'expected two axiom reports, got {len(audits)}'
          allowed=('propext','Classical.choice','Quot.sound')
          for report in audits:
            names={v.strip() for v in report.split(',') if v.strip()}
            assert all(v in allowed or any(v.startswith(w+'.{') for w in allowed) for v in names),names
            print('True mixed half radial original Riesz row axioms:', sorted(names))
          PY
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          cp "$target" evidence/sources/HBL/TypeIIDynamicSelection/
          sha256sum "$target" > evidence/source-hashes.txt
          cp HartreeMixedHalfRadialRieszAudit.lean evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-true-mixed-half-radial-riesz-evidence
          path: evidence
          retention-days: 14
