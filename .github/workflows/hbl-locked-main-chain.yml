name: HBL locked single-orbit main-chain strict
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/LockedSingleOrbitMainChain.lean'
      - '.github/workflows/hbl-locked-main-chain.yml'
      - 'HBL/LockedSingleOrbitExponents.lean'
      - 'HBL/LockedSingleOrbitBackward.lean'
      - 'HBL/WeightedThresholdResidualFeedback.lean'
      - 'HBL/WeightedJointBackwardResidualLipschitz.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeLockedPhysicalGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeScaledPhaseSourceTangent.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeMomentLockedSpeedTangents.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSelectedKummerRepairGain.lean'
      - 'HBL/TypeIIDynamicSelection/ActualKummerRepairTrueBackgroundTimeGain.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-main-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-locked-main-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-locked-backward-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-joint-residual-lip-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-realized-atlas-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict locked main-chain audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/LockedSingleOrbitMainChain.lean
          module=HBL.LockedSingleOrbitMainChain
          lake build "$module" > evidence/build.log 2>&1 || { tail -320 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > LockedMainChainAudit.lean <<'EOF'
          import HBL.LockedSingleOrbitMainChain
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.LockedMainChain.locked_main_chain_numerical_interface
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_selected_Kummer_repair_next_source_layer
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_physical_interface_repair_next_locked_layer
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_physical_interface_repair_selected_jet_next_locked_layer
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_repair_true_background_full_potential_time_gain
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_moment_locked_generated_remainder_next_locked_layer
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_moment_locked_scaled_phase_source_time_hasDerivAt
          #check @HBL.MainBackward.weightedThresholdResidualFeedbackMap_lipschitz
          #check @HBL.MainBackward.nonlinear_weighted_joint_backward_fixed_point_residual_lipschitz
          #check @HBL.MainBackward.locked_single_orbit_order_nine_fourths_backward_fixed_point
          set_option pp.all false in
          #print axioms HBL.LockedMainChain.locked_main_chain_numerical_interface
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_selected_Kummer_repair_next_source_layer
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_physical_interface_repair_next_locked_layer
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_physical_interface_repair_selected_jet_next_locked_layer
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_Kummer_repair_true_background_full_potential_time_gain
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_moment_locked_generated_remainder_next_locked_layer
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_moment_locked_scaled_phase_source_time_hasDerivAt
          set_option pp.all false in
          #print axioms HBL.MainBackward.nonlinear_weighted_joint_backward_fixed_point_residual_lipschitz
          set_option pp.all false in
          #print axioms HBL.MainBackward.locked_single_orbit_order_nine_fourths_backward_fixed_point
          EOF
          lake env lean --trust=0 -DwarningAsError=true LockedMainChainAudit.lean > evidence/audit.log 2>&1
          grep -q sorryAx evidence/audit.log && exit 1 || true
          cp "$target" evidence/
          sha256sum "$target" > evidence/source-hashes.txt
          cp LockedMainChainAudit.lean evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-locked-main-chain-audit
          path: evidence
          retention-days: 14
