name: HBL actual slow-inner Hartree weighted L2 strict
on:
  push:
    branches: [hbl-213-spectral-c1-trace-20261109]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSlowInnerHalfPowerWeightedL2.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeSlowInnerHalfPowerSource.lean'
      - '.github/workflows/hbl-213-slow-inner-half-power-weighted-L2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-slow-inner-half-power-source
  cancel-in-progress: false
jobs:
  strict-half-power:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic Mathlib.Analysis.SpecialFunctions.ImproperIntegrals > evidence/tactic-cache.log 2>&1
          lean --version | tee evidence/compiler-version.txt
          grep -F '4.35.0-rc3' evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: hbl-half-power-L2-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-half-power-L2-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-half-power-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Build actual source module
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.TypeIIDynamicSelection.ActualHartreeSlowInnerHalfPowerWeightedL2 > evidence/build.log 2>&1 || { tail -260 evidence/build.log; exit 1; }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .lake/build
          key: hbl-half-power-L2-build-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Strict exact types and per-theorem kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeSlowInnerHalfPowerWeightedL2.lean
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > HartreeSlowInnerHalfPowerL2Audit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeSlowInnerHalfPowerWeightedL2
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_slow_inner_half_power_weighted_L2
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_slow_inner_half_power_weighted_L2
          EOF
          lake env lean --trust=0 -DwarningAsError=true HartreeSlowInnerHalfPowerL2Audit.lean > evidence/audit.log 2>&1 || { cat evidence/audit.log; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path('evidence/audit.log').read_text()
          goals=['actual_Hartree_slow_inner_half_power_weighted_L2']
          assert 'sorryAx' not in data and 'Lean.ofReduceBool' not in data and 'admit' not in data
          assert '⋯' not in data and '…' not in data, 'Truncated exact theorem type'
          allowed={'propext','Classical.choice','Quot.sound'}
          for short in goals:
              goal='HBL.TypeIIDynamicSelection.'+short
              assert goal in data
              reports=re.findall(re.escape("'"+goal+"'")+r' depends on axioms:\s*\[([^\]]*)\]',data)
              assert len(reports)==1,(goal,reports)
              axioms={re.sub(r'\.\{.*\}$','',x.strip()) for x in reports[0].split(',') if x.strip()}
              assert axioms<=allowed,(goal,axioms)
              print('Exact strict source theorem:',goal,'axioms:',sorted(axioms))
          print('SCOPE: original nonlinear source weighted L2 only; no time gain or orbit; original 11/13 unchanged.')
          PY
          cp "$target" HartreeSlowInnerHalfPowerL2Audit.lean evidence/
          sha256sum "$target" HartreeSlowInnerHalfPowerL2Audit.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hbl-213-slow-inner-half-power-L2-strict-evidence
          path: evidence
          retention-days: 30
