name: HBL strong dynamics next check
on:
  push:
    branches: [hbl-main-strong-dynamics-next-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache/restore@v4
        id: project-cache
        with:
          path: .lake
          key: hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Resolve fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/MeasureTheory/Integral/IntegralEqImproper.lean Mathlib/Topology/MetricSpace/Contracting.lean Mathlib/Analysis/FunctionalSpaces/BesselPotentialSpace.lean)
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Strict actual full Hartree difference estimates
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.HartreeDensityDifferenceBounds HBL.HartreeFullDifferenceBounds 2>&1 | tee evidence/difference-build.log
          for name in HartreeDensityDifferenceBounds HartreeFullDifferenceBounds; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/$name.lean" 2>&1 | tee "evidence/$name-strict.log"
          done
          python3 - <<'PY'
          import pathlib,re,subprocess
          for name,count in [('HartreeDensityDifferenceBounds',5),('HartreeFullDifferenceBounds',6)]:
            source=pathlib.Path(f'HBL/{name}.lean').read_text()
            assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',source)
            names=['HBL.RegularRadiation.PhysicalExpansion.'+n for n in re.findall(r'^(?:def|theorem) (\w+)',source,re.M)]
            assert len(names)==count and len(set(names))==count, (name,names)
            text=f'import HBL.{name}\n\nset_option pp.all true\nset_option pp.maxSteps 10000000\nset_option maxRecDepth 1000000\n\n'
            text+='\n'.join('#check @'+n for n in names)+'\n\n'
            text+='\n'.join('set_option pp.all false in\n#print axioms '+n for n in names)+'\n'
            audit=pathlib.Path(f'evidence/{name}-audit.lean')
            audit.write_text(text)
            with open(f'evidence/{name}-types.txt','w') as out:
              subprocess.run(['lake','env','lean','--trust=0','-DwarningAsError=true',str(audit)],stdout=out,stderr=subprocess.STDOUT,check=True)
          PY
      - name: Recheck all eight previous production targets and audits
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.RegularRadiationFlow HBL.StrongConstrainedCenterEvolution HBL.WeightedStrongDynamics HBL.WeightedTailIdentities HBL.HartreePhysicalLinearization HBL.LocalizedCenterNonlinearMap HBL.HartreeDensitySourceBounds HBL.HartreeFullRemainderBounds 2>&1 | tee evidence/previous-build.log
          for name in RegularRadiationFlow StrongConstrainedCenterEvolution WeightedStrongDynamics WeightedTailIdentities HartreePhysicalLinearization LocalizedCenterNonlinearMap HartreeDensitySourceBounds HartreeFullRemainderBounds; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/$name.lean" 2>&1 | tee "evidence/$name.log"
          done
          for name in FinalBridgeAudit LocalizedCenterAudit RegularRadiationFlowAudit HartreeDensitySourceAudit HartreeFullRemainderAudit; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/$name.lean" > "evidence/$name-types.txt" 2>&1
          done
      - name: Exact inventories, complete types and conditional-boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json,subprocess
          root=pathlib.Path('.')
          base='1c8b2519627653ac07d6ae5a39de406ae9af5b1f'
          permitted={'HBL/HartreeDensityDifferenceBounds.lean','HBL/HartreeFullDifferenceBounds.lean','.github/workflows/strong-dynamics-next.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= permitted, changed-permitted
          inventories=[(f'HBL/{n}.lean',f'{n}-types.txt',c) for n,c in [('FinalBridgeAudit',20),('LocalizedCenterAudit',21),('RegularRadiationFlowAudit',18),('HartreeDensitySourceAudit',5),('HartreeFullRemainderAudit',7)]]
          inventories += [(f'evidence/{n}-audit.lean',f'{n}-types.txt',c) for n,c in [('HartreeDensityDifferenceBounds',5),('HartreeFullDifferenceBounds',6)]]
          allowed={'propext','Classical.choice','Quot.sound'}
          groups={}
          for src,filename,count in inventories:
            a=pathlib.Path(src).read_text()
            names=re.findall(r'^#print axioms (\S+)$',a,re.M)
            checked=re.findall(r'^#check @(\S+)$',a,re.M)
            assert len(names)==count and len(set(names))==count and checked==names
            text=(root/'evidence'/filename).read_text()
            pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
            found=[(m.group(1),m.group(2) or '') for m in re.finditer(pattern,text,re.S)]
            assert [n for n,_ in found]==names, (src,names,found)
            assert 'sorryAx' not in text and '⋯' not in text and '...' not in text
            for n,axs in found:
              assert {x.strip() for x in axs.split(',') if x.strip()} <= allowed, (n,axs)
            groups[src]={n:[x.strip() for x in axs.split(',') if x.strip()] for n,axs in found}
          report={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'base':base,'changed_paths':sorted(changed),'all_previous_production_sources_unchanged':True,'strict_production_modules':10,'audited_named_declarations':82,'new_audited_named_declarations':11,'new_public_theorems':6,'trust_zero':True,'warning_as_error':True,'complete_statement_types':True,'axioms':groups,'native_results':['actual linear density potential difference is first order in difference radius','actual quadratic density potential difference retains radius times difference','full physical remainder difference includes the nonlocal W3 term','L2 squared difference is bounded by an explicit multiple of radius squared times difference squared','essential-supremum difference is bounded by an explicit multiple of radius times difference'],'conditional_boundary':'These are order-zero mixed L2/L-infinity estimates for two actual perturbations. Higher Sobolev source bounds, physical constrained evolution, high-regularity local-theory existence, reconstruction and the initial-data graph remain open. No original manuscript environment is newly certified.','original_environments_added':0,'main_theorem_closed':False,'full_paper_percentage_recertified':False}
          (root/'evidence/full-difference-audit.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve sources and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git diff 1c8b2519627653ac07d6ae5a39de406ae9af5b1f HEAD > evidence/full-difference.patch
          git ls-files -z '*.lean' lean-toolchain lakefile.lean lake-manifest.json '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/source-hashes.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-final-bridge-${{ github.sha }}
          path: evidence
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
