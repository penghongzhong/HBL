name: HBL strong dynamics next check
on:
  push:
    branches: [hbl-main-strong-dynamics-next-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache/restore@v4
        id: project-cache
        with:
          path: .lake
          key: hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Resolve fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/MeasureTheory/Integral/IntegralEqImproper.lean Mathlib/Topology/MetricSpace/Contracting.lean Mathlib/Analysis/FunctionalSpaces/BesselPotentialSpace.lean)
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Strict physical regular-radiation repair
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.RegularRadiationFlow 2>&1 | tee evidence/radiation-build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/RegularRadiationFlow.lean 2>&1 | tee evidence/radiation-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/RegularRadiationFlowAudit.lean > evidence/radiation-types-and-axioms.txt 2>&1
      - name: Recheck all previously accepted bridge and localization targets
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.StrongConstrainedCenterEvolution HBL.WeightedStrongDynamics HBL.WeightedTailIdentities HBL.HartreePhysicalLinearization HBL.LocalizedCenterNonlinearMap 2>&1 | tee evidence/previous-build.log
          for name in StrongConstrainedCenterEvolution WeightedStrongDynamics WeightedTailIdentities HartreePhysicalLinearization LocalizedCenterNonlinearMap; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/$name.lean" 2>&1 | tee "evidence/$name.log"
          done
          lake env lean --trust=0 -DwarningAsError=true HBL/FinalBridgeAudit.lean > evidence/types-and-axioms.txt 2>&1
          lake env lean --trust=0 -DwarningAsError=true HBL/LocalizedCenterAudit.lean > evidence/localized-types-and-axioms.txt 2>&1
      - name: Exact inventories, complete types and conditional-boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json,subprocess
          root=pathlib.Path('.')
          base='46cbc19384a5c6503b0b90a6175b61c2714dc7aa'
          permitted={'HBL/RegularRadiationFlow.lean','HBL/RegularRadiationFlowAudit.lean','.github/workflows/strong-dynamics-next.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= permitted, changed-permitted
          inventories=[('FinalBridgeAudit','types-and-axioms.txt',20),('LocalizedCenterAudit','localized-types-and-axioms.txt',21),('RegularRadiationFlowAudit','radiation-types-and-axioms.txt',18)]
          allowed={'propext','Classical.choice','Quot.sound'}
          groups={}
          for module,filename,count in inventories:
            a=(root/f'HBL/{module}.lean').read_text()
            names=re.findall(r'^#print axioms (\S+)$',a,re.M)
            checked=re.findall(r'^#check @(\S+)$',a,re.M)
            assert len(names)==count and len(set(names))==count and checked==names
            text=(root/'evidence'/filename).read_text()
            pattern=r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
            found=[(m.group(1),m.group(2) or '') for m in re.finditer(pattern,text,re.S)]
            assert [n for n,_ in found]==names, (module,names,found)
            assert 'sorryAx' not in text and '⋯' not in text and '...' not in text
            for n,axs in found:
              assert {x.strip() for x in axs.split(',') if x.strip()} <= allowed, (n,axs)
            groups[module]={n:[x.strip() for x in axs.split(',') if x.strip()] for n,axs in found}
          source=(root/'HBL/RegularRadiationFlow.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b',source)
          for required in ['physicalL2_toDistr','physicalQuarticPotential_bound','Laplacian.laplacian u.toDistr','hartreeNonlinearity κ (physicalL2 u)','  equation :','2 * (a + 1) ≤ L','2 * a ≤ L','ContDiffOn ℝ 1']:
            assert required in source, required
          report={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'base':base,'changed_paths':sorted(changed),'previous_bridge_and_localization_sources_unchanged':True,'strict_production_modules':6,'audited_named_declarations':59,'radiation_audited_named_declarations':18,'trust_zero':True,'warning_as_error':True,'complete_statement_types':True,'axioms':groups,'native_results':['physical L2 representative defines the original tempered distribution','actual quartic convolution is absolutely integrable under the displayed L-infinity bound','distributional Laplacian has the correct two-derivative loss','jet derivative transfers to the original Sobolev curve'],'conditional_boundary':'Existence of GeneralizedHartreeRegularLocalTheory remains an explicit external obligation. Its equation field now states the actual Hartree PDE. High-regularity finite jets and local C1 dependence are not certified merely by the critical local-theory citation. StrongConstrainedCenterPropagator and physical centre source estimates remain unconstructed.','original_environments_added':0,'main_theorem_closed':False,'full_paper_percentage_recertified':False}
          (root/'evidence/physical-radiation-repair-audit.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve sources and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git diff 46cbc19384a5c6503b0b90a6175b61c2714dc7aa HEAD > evidence/physical-radiation-repair.patch
          git ls-files -z '*.lean' lean-toolchain lakefile.lean lake-manifest.json '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/source-hashes.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-final-bridge-${{ github.sha }}
          path: evidence
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
