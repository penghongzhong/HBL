name: HBL target-scope regression ONLY - not manuscript 2.13 acceptance
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/Verification/FiniteProfileScopeRegression*.lean'
      - '.github/workflows/hbl-213-target-scope-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-target-scope-audit-20261104
  cancel-in-progress: true
jobs:
  scope-regression-not-manuscript-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install identical pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve identical pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || echo 'Mandatory exact-source build follows.'
          lean --version > evidence/compiler-version.txt
      - name: Restore accumulated proof pool
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-target-scope-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-target-scope-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-finite-rank-transmission-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict scope regression and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=re.sub(r'/\-.*?\-/','',Path('HBL/Verification/FiniteProfileScopeRegression.lean').read_text(),flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s)
          PY
          lake build HBL.Verification.FiniteProfileScopeRegression HBL.Verification.FiniteProfileScopeRegressionAudit 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/Verification/FiniteProfileScopeRegression.lean 2>&1 | tee evidence/source-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/Verification/FiniteProfileScopeRegressionAudit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          for v in ['radialProbe_original_residual','structural_terminal_allows_empty_packets_and_nonzero_residual']:
              n='HBL.Verification.FiniteProfileScope.'+v
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          result={'scope_regression':'strict_pass','manuscript_213':'OPEN','main_typeII':'OPEN','manuscript_count_increment':0,'reason':'Structural packets and assigned increasing weights are not a realization of the actual PDE residual.'}
          Path('evidence/scope-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('SCOPE REGRESSION PASS ONLY: manuscript 2.13 and Type-II theorem remain OPEN; do not increment the manuscript count.')
          PY
      - name: Save incremental proof pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-target-scope-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/sources
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/Verification/FiniteProfileScopeRegression*.lean > evidence/source-hashes.txt
          cp HBL/Verification/FiniteProfileScopeRegression*.lean evidence/sources/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-target-scope-regression-not-acceptance
          path: evidence
          retention-days: 14
