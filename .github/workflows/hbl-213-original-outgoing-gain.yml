name: HBL 2.13 same physical source original outgoing normalization
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualOriginGreenIntegrable.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeOriginOutgoingGain*.lean'
      - '.github/workflows/hbl-213-original-outgoing-gain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-original-outgoing-gain-20261104
  cancel-in-progress: true
jobs:
  strict-original-outgoing-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic Mathlib.Analysis.ODE.Gronwall Mathlib.MeasureTheory.Integral.IntervalIntegral.LebesgueDifferentiationThm > evidence/tactic-cache.log 2>&1 || echo 'Mandatory exact-source build follows.'
          lean --version > evidence/compiler-version.txt
      - name: Restore accumulated compiled source
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-original-outgoing-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-original-outgoing-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-charge-reference-kummer-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-full-source-kummer-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict original Green integrability source and endpoint audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          for f in ['ActualOriginGreenIntegrable','ActualHartreeOriginOutgoingGain']:
              s=re.sub(r'/\-.*?\-/','',Path('HBL/TypeIIDynamicSelection/'+f+'.lean').read_text(),flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s),f
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeOriginOutgoingGain HBL.TypeIIDynamicSelection.ActualHartreeOriginOutgoingGainAudit 2>&1 | tee evidence/build.log
          for f in ActualOriginGreenIntegrable ActualHartreeOriginOutgoingGain; do
            lake env lean --trust=0 -DwarningAsError=true "HBL/TypeIIDynamicSelection/${f}.lean" 2>&1 | tee "evidence/${f}-strict.log"
          done
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeOriginOutgoingGainAudit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          names=['actual_origin_Green_source_integrability','actual_origin_Green_integrable_forcing_ae_equation','actual_Hartree_scaled_Kummer_source_measurable','actual_Hartree_scaled_Kummer_source_intervalIntegrable','actual_Hartree_origin_outgoing_gain_on_annulus','exists_actual_Hartree_original_outgoing_uniform_gain']
          for v in names:
              n='HBL.TypeIIDynamicSelection.'+v
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT ORIGINAL OUTGOING GAIN PASS: genuine integrable source densities, actual a.e. ODE, exact original endpoint normalizations, same complete base-core/radiation Hartree source and compact-parameter eighth-order bound on a prescribed fixed annulus. No independent remote match or complete 2.13 acceptance is claimed.')
          PY
      - name: Save incremental proof pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-original-outgoing-gain-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/sources
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualOriginGreenIntegrable.lean HBL/TypeIIDynamicSelection/ActualHartreeOriginOutgoingGain*.lean > evidence/source-hashes.txt
          cp HBL/TypeIIDynamicSelection/ActualOriginGreenIntegrable.lean HBL/TypeIIDynamicSelection/ActualHartreeOriginOutgoingGain*.lean evidence/sources/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-original-outgoing-gain-audit
          path: evidence
          retention-days: 14
