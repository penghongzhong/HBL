name: HBL threshold obstruction audit

on:
  push:
    branches: [hbl-threshold-obstruction-audit-20261025]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hbl-threshold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Protect accepted main and fixed dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import subprocess, pathlib, textwrap, re
          base='16eea991ad72990e2c1e8c4651413a29e0bda040'
          permitted={'HBL/ThresholdJordanWitness.lean','HBL/ThresholdJordanAudit.lean','.github/workflows/threshold-audit.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= permitted, delta-permitted
          s=pathlib.Path('HBL/ThresholdJordanWitness.lean').read_text()
          s=re.sub(r'/\-.*?\-/','',s,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',s)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          print('Accepted main sources unchanged. Diagnostic branch only; manuscript stays 8/21.')
          PY
      - name: Install pinned compiler
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies
        run: bash -euo pipefail /tmp/hbl-dependencies.sh
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Compile actual threshold witness
        run: |
          set -euo pipefail
          lake build HBL.ThresholdJordanWitness 2>&1 | tee evidence/build.log
      - name: Strict kernel and exact diagnostic types
        run: |
          set -euo pipefail
          lake env lean --trust=0 -DwarningAsError=true HBL/ThresholdJordanWitness.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/ThresholdJordanAudit.lean 2>&1 | tee evidence/types-and-axioms.txt
          git ls-files -z '*.lean' lean-toolchain lake-manifest.json .github/workflows/lean.yml | xargs -0 sha256sum > evidence/all-sources.sha256
      - name: Audit exact diagnostic dependency inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json
          s=pathlib.Path('evidence/types-and-axioms.txt').read_text()
          names=['HBL.Modulation.ThresholdAudit.jordanHalfLine_exact','HBL.Modulation.ThresholdAudit.no_bounded_zero_projection_of_range_limit']
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          assert [r[0] for r in rows]==names, rows
          for name,body in rows:
              axioms={a.strip() for a in body.split(',') if a.strip()}
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          assert 'sorryAx' not in s
          out={'diagnostic_declarations':names,'kernel_checked':True,'prior_accepted_sources_unchanged':True,'manuscript_accepted':8,'manuscript_total':21,'cutoff_sobolev_convergence_formalized':False,'main_modified':False}
          pathlib.Path('evidence/audit.json').write_text(json.dumps(out,indent=2))
          print('Two diagnostic declarations checked; no additional numbered manuscript acceptance.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-threshold-audit-${{ github.sha }}
          path: |
            evidence
            HBL/ThresholdJordanWitness.lean
            HBL/ThresholdJordanAudit.lean
            .github/workflows/threshold-audit.yml
          include-hidden-files: true
          retention-days: 14
