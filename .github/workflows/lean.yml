name: HBL Lean kernel check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hbl-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain immutable baseline verifier and extend exact inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap
          base = 'c640b3735f3cb08ac9a52d3136c33f3dd4163db7'
          old = subprocess.check_output(['git','show',base+':.github/workflows/lean.yml'], text=True)
          Path('/tmp/hbl-baseline.yml').write_text(old)
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines())
          permitted = {'.github/workflows/lean.yml','HBL/PhysicalRadial3PhaseCore.lean','HBL/PhaseCoreAudit.lean','HBL/PhaseBubbleKernel.lean','HBL/BubbleKernelAudit.lean'}
          if not changed <= permitted:
              raise SystemExit('Unexpected change outside frozen baseline: '+repr(changed-permitted))
          def shell_body(name):
              chunk = old.split('      - name: '+name+'\n',1)[1].split('\n      - ',1)[0]
              return textwrap.dedent(chunk.split('        run: |\n',1)[1])
          subprocess.run(['bash','-euo','pipefail','-c',shell_body('Enforce source-only publication and proof policy')], check=True)
          Path('/tmp/hbl-dependencies.sh').write_text(shell_body('Resolve exact dependencies and obtain targeted Mathlib cache'))
          Path('/tmp/hbl-strict.sh').write_text(shell_body('Strict spectral leaves and complete exported types'))
          names = [
              'HBL.Modulation.Monopole.radialU_deriv_memLp_of_upperSupport',
              'HBL.Modulation.Monopole.radialU_global_energy_of_upperSupport',
              'HBL.Modulation.Monopole.physicalRadial3_gradient_coordinate_of_upperSupport',
              'HBL.Modulation.Monopole.physicalRadial3_phase_core_eq_volterra',
              'HBL.Modulation.Monopole.physicalRadial3_phase_core_nonnegative',
              'HBL.Modulation.Monopole.physicalRadial3_phase_core_coercive',
              'HBL.Modulation.Monopole.weightedVolterraGram_bubble',
              'HBL.Modulation.Monopole.weightedVolterraAMinus_bubble_zero',
              'HBL.Modulation.Monopole.phaseBubble_energy_ne_zero',
              'HBL.Modulation.Monopole.weightedVolterraAMinus_kernel_eq_bubble_span',
              'HBL.Modulation.Monopole.phaseBubble_orthogonal_iff',
              'HBL.Modulation.Monopole.phaseBubble_coordinate_pairing',
              'HBL.Modulation.Monopole.physicalRadial3_phase_core_bubble_coercive',
          ]
          sources = [Path('HBL/PhaseCoreAudit.lean').read_text(), Path('HBL/BubbleKernelAudit.lean').read_text()]
          added = [name for source in sources for name in re.findall(r'^#print axioms (\S+)', source, re.M)]
          checked = [name for source in sources for name in re.findall(r'^#check @(\S+)', source, re.M)]
          if added != names or checked != names or len(set(names)) != 13:
              raise SystemExit('Batch type/dependency inventory mismatch')
          audit = shell_body('Inspect kernel dependencies').split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          marker = 'if len(new_chain_expected) != len(set(new_chain_expected)) or expected_full & set(new_chain_expected):'
          if audit.count(marker) != 1:
              raise SystemExit('Immutable verifier injection anchor mismatch')
          audit = audit.replace(marker, 'new_chain_expected += '+repr(names)+'\n'+marker)
          Path('/tmp/hbl-audit.py').write_text(audit)
          print('Frozen 1379-declaration verifier retained; thirteen explicit type/dependency entries added. Manuscript acceptance remains 8/21.')
          PY
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies and obtain targeted Mathlib cache
        shell: bash
        run: bash -euo pipefail /tmp/hbl-dependencies.sh
      - name: Restore source-bound project intermediates
        id: hbl_build_cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Compile original HBL and physical phase bridge
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL HBL.PhysicalRadial3PhaseCore HBL.PhaseBubbleKernel
      - name: Strict spectral leaves and complete exported types
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail /tmp/hbl-strict.sh
          lake env lean --trust=0 -DwarningAsError=true HBL/PhysicalRadial3PhaseCore.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/PhaseBubbleKernel.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/PhaseCoreAudit.lean > /tmp/hbl-batch-types-and-axioms.txt
          lake env lean --trust=0 -DwarningAsError=true HBL/BubbleKernelAudit.lean >> /tmp/hbl-batch-types-and-axioms.txt
          cat /tmp/hbl-batch-types-and-axioms.txt >> /tmp/hbl-full-types.txt
          git ls-files -z '*.lean' lean-toolchain lake-manifest.json .github/workflows/lean.yml | xargs -0 sha256sum > /tmp/hbl-all-sources.sha256
      - name: Inspect original and new kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 HBL/Audit.lean | tee /tmp/hbl-axioms.txt
          cat /tmp/hbl-batch-types-and-axioms.txt >> /tmp/hbl-axioms.txt
          python3 /tmp/hbl-audit.py
      - name: Preserve exact spectral type and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbl-spectral-audit-${{ github.sha }}
          path: |
            /tmp/hbl-full-types.txt
            /tmp/hbl-axioms.txt
            /tmp/hbl-batch-types-and-axioms.txt
            /tmp/hbl-commit.txt
            /tmp/hbl-spectral-sources.sha256
            /tmp/hbl-all-sources.sha256
            /tmp/hbl-baseline.yml
            /tmp/hbl-audit.py
          if-no-files-found: warn
          retention-days: 7
      - name: Retain intermediate proof build cache
        if: always() && steps.hbl_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.hbl_build_cache.outputs.cache-primary-key }}
