name: HBL Lean kernel check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbl-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce source-only publication and proof policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          configs = {'.gitignore', 'lean-toolchain', 'lake-manifest.json', '.github/workflows/lean.yml'}
          for name in paths:
              if not (name.endswith('.lean') or name in configs):
                  raise SystemExit('Unexpected public file: ' + name)
          prohibited = re.compile(r'\b(sorry|admit|axiom|native_decide)\b')
          for name in paths:
              if name.endswith('.lean') and prohibited.search(Path(name).read_text()):
                  raise SystemExit('Disallowed proof token in ' + name)
          print('Source-only and proof-token policy passed.')
          PY
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies and obtain targeted Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Analysis.Calculus.ParametricIntervalIntegral Mathlib.Analysis.SpecialFunctions.Sqrt Mathlib.Analysis.SpecialFunctions.Trigonometric.Deriv Mathlib.Analysis.Calculus.FDeriv.Prod Mathlib.Analysis.Calculus.ImplicitContDiff Mathlib.Analysis.InnerProductSpace.Calculus Mathlib.Analysis.InnerProductSpace.Dual Mathlib.MeasureTheory.Integral.IntervalIntegral.FundThmCalculus Mathlib.Analysis.Calculus.ContDiff.Deriv Mathlib.MeasureTheory.Function.LpSpace.Basic Mathlib.MeasureTheory.Integral.Bochner.Basic Mathlib.MeasureTheory.Measure.Typeclasses.Finite Mathlib.Topology.Order.Compact Mathlib.Tactic.FunProp Mathlib.Tactic.NormNum Mathlib.Tactic.Positivity Mathlib.Tactic.Ring Mathlib.Tactic.Linarith
      - name: Compile HBL proof components
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL
      - name: Inspect kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean HBL/Audit.lean | tee /tmp/hbl-axioms.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/hbl-axioms.txt').read_text()
          expected = ['bubble_differentiable', 'scalePullback_hasDerivAt', 'bubble_scale_derivative', 'phasePullback_hasDerivAt', 'tangentCoordinates_eq_neg', 'tangentCoordinates_bijective', 'parameterNegId_isInvertible', 'tangentCoordinates_eq_parameterNegId', 'local_modulation_from_normalized_jacobian', 'testPair_comp_symmetryTangent', 'testedConstraint_contDiffAt', 'testedConstraint_partial_fderiv', 'local_modulation_from_tested_residual', 'dualTestConstraint_contDiffAt', 'dualTestConstraint_base_zero', 'physicalParameters_contDiffAt', 'physical_selector_from_log_selector', 'physicalParameters_log_left_inverse', 'log_physicalParameters_left_inverse', 'dualRepresenter_pairing', 'rieszTestConstraint_contDiffAt', 'rieszTestConstraint_base_zero', 'radialHardy3D', 'continuous_memLp_restrict_Ioc', 'compactTest_cauchySchwarz', 'radialU_continuous', 'compactThresholdPairing_abs_le', 'radialU_L2_sq_le_local', 'compactThresholdPairing_abs_le_of_hardy', 'continuousFunctionalOfBound_apply', 'continuousFunctionalOfBound_norm_le', 'local_modulation_physical_from_tested_residual', 'local_modulation_from_dual_tests', 'local_modulation_physical_from_dual_tests', 'partial_jacobian_from_slice', 'dualTest_partial_jacobian_from_slice', 'local_modulation_physical_from_dual_slice', 'local_modulation_physical_from_riesz_slice', 'phaseChannelTest_contDiffAt', 'phaseChannelTest_real_state', 'phaseChannelTest_hasDerivAt_real_state', 'scalePhaseObservable_contDiffAt', 'scalePhaseObservable_real_state', 'scalePhase_slice_hasFDerivAt', 'scalePhaseResidual_base_zero', 'scalePhaseResidual_contDiffAt', 'scalePhaseResidual_partial_jacobian', 'scalePhase_local_modulation_physical', 'transportedRadialTest_hasDerivAt', 'transportedRadialTest_zero', 'transportedRadialTest_hasDerivAt_zero', 'transportedRadialTest_scale_ibp', 'transportedRadialTest_scale_normalized', 'transportedRadialTestIntegral_hasDerivAt_of_bound', 'transportedRadialTestIntegral_hasDerivAt', 'transportedRadialTestIntegral_scale_normalized', 'bubble_contDiff', 'bubble_normalized_scale_integral', 'bubble_phase_pairing_at_zero', 'bubble_normalized_phase_derivative', 'radialHardy3D_restrict', 'compactThresholdPairing_energyCore_bound']
          for name in expected:
              if 'HBL.Modulation.' + name not in text:
                  raise SystemExit('Missing dependency report: ' + name)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for block in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text, flags=re.S):
              found = {x.strip() for x in block.split(',') if x.strip()}
              if not found <= allowed:
                  raise SystemExit('Unapproved kernel dependency: ' + repr(found - allowed))
          if 'sorryAx' in text:
              raise SystemExit('Unfinished proof dependency found.')
          print('Sixty-two component dependency reports checked; no whole-paper theorem is certified.')
          PY
