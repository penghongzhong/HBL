name: HBL Lean kernel check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbl-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce source-only publication and proof policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          configs = {'.gitignore', 'lean-toolchain', 'lake-manifest.json', '.github/workflows/lean.yml'}
          for name in paths:
              if not (name.endswith('.lean') or name in configs):
                  raise SystemExit('Unexpected public file: ' + name)
          prohibited = re.compile(r'\b(sorry|admit|axiom|native_decide)\b')
          for name in paths:
              if name.endswith('.lean') and prohibited.search(Path(name).read_text()):
                  raise SystemExit('Disallowed proof token in ' + name)
          print('Source-only and proof-token policy passed.')
          PY
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Resolve exact dependencies and obtain targeted Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Analysis.SpecialFunctions.SmoothTransition Mathlib.Analysis.Calculus.BumpFunction.FiniteDimension Mathlib.Analysis.Calculus.ContDiff.Deriv Mathlib.Analysis.SpecialFunctions.Trigonometric.Angle Mathlib.MeasureTheory.Measure.Haar.NormedSpace Mathlib.Analysis.SpecificLimits.Basic Mathlib.Analysis.SpecialFunctions.ImproperIntegrals Mathlib.Analysis.Calculus.MeanValue Mathlib.Analysis.Calculus.Deriv.Slope Mathlib.MeasureTheory.Integral.DominatedConvergence Mathlib.MeasureTheory.Function.LpSpace.Complete Mathlib.MeasureTheory.Function.L2Space Mathlib.Topology.Algebra.LinearMapCompletion Mathlib.Analysis.Calculus.ParametricIntervalIntegral Mathlib.Analysis.SpecialFunctions.Sqrt Mathlib.Analysis.SpecialFunctions.Trigonometric.Deriv Mathlib.Analysis.Calculus.FDeriv.Prod Mathlib.Analysis.Calculus.ImplicitContDiff Mathlib.Analysis.InnerProductSpace.Calculus Mathlib.Analysis.InnerProductSpace.Dual Mathlib.MeasureTheory.Integral.IntervalIntegral.FundThmCalculus Mathlib.Analysis.Calculus.ContDiff.Deriv Mathlib.MeasureTheory.Function.LpSpace.Basic Mathlib.MeasureTheory.Integral.Bochner.Basic Mathlib.MeasureTheory.Measure.Typeclasses.Finite Mathlib.Topology.Order.Compact Mathlib.Tactic.FunProp Mathlib.Tactic.NormNum Mathlib.Tactic.Positivity Mathlib.Tactic.Ring Mathlib.Tactic.Linarith
          lake exe cache get Mathlib.Analysis.Convolution Mathlib.Analysis.SpecialFunctions.Integrability.Basic Mathlib.Analysis.SpecialFunctions.Pow.Real Mathlib.Analysis.SpecialFunctions.Pow.Asymptotics Mathlib.Analysis.SpecialFunctions.JapaneseBracket Mathlib.Analysis.SpecialFunctions.Integrals.Log Mathlib.Analysis.SpecialFunctions.Trigonometric.Sinc Mathlib.MeasureTheory.Integral.IntegralEqImproper
          lake exe cache get Mathlib.Analysis.Normed.Operator.Compact.FiniteDimension Mathlib.Analysis.InnerProductSpace.Spectrum Mathlib.MeasureTheory.Measure.MeasuredSets Mathlib.MeasureTheory.Measure.SeparableMeasure
          lake exe cache get Mathlib.Analysis.Fourier.AddCircle Mathlib.NumberTheory.ZetaValues Mathlib.MeasureTheory.Function.JacobianOneDim Mathlib.MeasureTheory.Measure.OpenPos Mathlib.Analysis.Complex.RealDeriv Mathlib.Analysis.SpecialFunctions.Log.Deriv Mathlib.Analysis.Calculus.FDeriv.Measurable Mathlib.MeasureTheory.Integral.Bochner.ContinuousLinearMap Mathlib.MeasureTheory.Integral.Prod
      - name: Restore source-bound project intermediates
        id: hbl_build_cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('HBL.lean', 'HBL/**/*.lean') }}
          restore-keys: |
            hbl-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Record project cache provenance
        shell: bash
        run: |
          printf 'Project cache exact hit: %s\n' '${{ steps.hbl_build_cache.outputs.cache-hit }}'
          printf 'Project cache matched key: %s\n' '${{ steps.hbl_build_cache.outputs.cache-matched-key }}'
          printf 'Project cache requested key: %s\n' '${{ steps.hbl_build_cache.outputs.cache-primary-key }}'
          if [ -d .lake/build ]; then find .lake/build -type f -name '*.olean' | wc -l; fi
          echo 'Restored intermediates are not acceptance evidence. Lake validates source/dependency traces; strict trust-zero checks and exact axiom coverage remain mandatory.'
      - name: Compile HBL proof components
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL
      - name: Strict spectral leaves and complete exported types
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraAPlusKernel.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraAPlusModes.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraAPlusCoercivity.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraAPlusMorse.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraProfileBridge.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedHartreeProfileForm.lean
          lake env lean --trust=0 -DwarningAsError=true HBL/WeightedVolterraRadialForm.lean
          lake env lean --trust=0 -DwarningAsError=true HBL.lean
          lake env lean --trust=0 HBL/SpectralBridgeTypes.lean > /tmp/hbl-full-types.txt
          git rev-parse HEAD > /tmp/hbl-commit.txt
          sha256sum lean-toolchain lakefile.lean lake-manifest.json HBL/WeightedVolterraAPlus*.lean HBL/WeightedVolterraProfileBridge.lean HBL/WeightedHartreeProfileForm.lean HBL/WeightedVolterraRadialForm.lean HBL/SpectralBridgeTypes.lean > /tmp/hbl-spectral-sources.sha256
          wc -c /tmp/hbl-full-types.txt
          sha256sum /tmp/hbl-full-types.txt
      - name: Inspect kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 HBL/Audit.lean | tee /tmp/hbl-axioms.txt
          python3 - <<'PY'
