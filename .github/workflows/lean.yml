          for name in expected_full:
              if name not in text:
                  raise SystemExit('Missing dependency report: ' + name)
          reports = re.findall(r"'([^']+)' depends on axioms:", text)
          def strip_lean_comments(source):
              result, i, depth, quoted = [], 0, 0, False
              while i < len(source):
                  if depth:
                      if source.startswith('/-', i): depth += 1; i += 2
                      elif source.startswith('-/', i): depth -= 1; i += 2
                      else: result.append('\n' if source[i] == '\n' else ' '); i += 1
                  elif quoted:
                      if source[i] == '\\': i += 2
                      elif source[i] == '"': quoted = False; i += 1
                      else: result.append('\n' if source[i] == '\n' else ' '); i += 1
                  elif source.startswith('/-', i): depth = 1; i += 2
                  elif source.startswith('--', i):
                      end = source.find('\n', i)
                      i = len(source) if end < 0 else end
                  elif source[i] == '"': quoted = True; i += 1
                  else: result.append(source[i]); i += 1
              return ''.join(result)
          public_pattern = re.compile(r'^\s*(?:@\[[^\n]*\]\s*)?(?:(private|protected)\s+)?(?:theorem|lemma)\s+(\S+)', re.M)
          public_count = sum(visibility != 'private'
              for path in Path('HBL').glob('*.lean')
              for visibility, name in public_pattern.findall(strip_lean_comments(path.read_text())))
          if public_count != len(reports):
              raise SystemExit(f'Public theorem/lemma coverage mismatch: {public_count} declarations, {len(reports)} reports')

          expected_reports = expected_full
          if len(expected) + len(generic_expected) + len(fredholm_expected) + len(bridge_expected) + len(new_chain_expected) != len(expected_reports):
              raise SystemExit('Duplicate expected dependency report')
          if len(reports) != len(set(reports)) or set(reports) != expected_reports:
              raise SystemExit('Dependency report set does not match the audited inventory')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for block in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text, flags=re.S):
              found = {x.strip() for x in block.split(',') if x.strip()}
              if not found <= allowed:
                  raise SystemExit('Unapproved kernel dependency: ' + repr(found - allowed))
          if 'sorryAx' in text:
              raise SystemExit('Unfinished proof dependency found.')
          print(f'{len(expected_reports)} component dependency reports checked; eight revised manuscript environments certified (8/21); revised Lemma 2.6 certifies actual radial cutoff core cancellation and the original fixed compact coordinate integrals in space and time; its stronger three-dimensional radiation and matching form remains unproved; revised Lemma 5.1 certifies actual nonautonomous scalar terminal shooting and coefficient/source stability; its Hartree parameter and same-physical-time transport application remains unproved; revised Lemma 2.7 proves the actual synchronized initial slice by a reciprocal-tail integral and the intermediate value theorem, with a common terminal amplitude, explicit local uniqueness and quantitative path stability; revised Lemma 2.5 proves the fixed Hilbert-normalized profile for the concrete half-line operator; the three-dimensional radial-conjugation bridge remains unaudited; original all-classical uniqueness and cutoff invariance remain unproved (original stronger text 4/21); every nonzero positive Green eigenpair is quantized by the arctan Dirichlet boundary condition, and the only eigenvalue in [1/21,1/9] is 1/15 with eigenspace span{{x_0}}; the concrete Green--Hartree square identity and one-dimensional Birman--Schwinger fixed space are proved; the first monopole remainder has a certified O(1/r) tail; the physical power-law dictionary is proved for the actual reconstructed paths with quantitative relative error O(tau^(4*mu_infty*delta)), where 4*mu_infty*delta is positive; the actual phase has logarithmic physical-time expansion with error O(tau^(4*mu_infty*delta)) by exact reciprocal-tail cancellation; the actual physical clock is continuous, strictly decreasing and covers each time in (0,tau(s0)] uniquely; the actual inverse time tends to infinity as remaining time tends to zero, the scale and phase power errors are proved directly at the physical terminal time from below, and the original phase integral satisfies its differential equation; the main blowup theorem remains unaccepted.')
          PY
      - name: Preserve exact spectral type and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbl-spectral-audit-${{ github.sha }}
          path: |
            /tmp/hbl-full-types.txt
            /tmp/hbl-axioms.txt
            /tmp/hbl-commit.txt
            /tmp/hbl-spectral-sources.sha256
          if-no-files-found: warn
          retention-days: 7
      - name: Retain intermediate proof build cache
        if: always() && steps.hbl_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.hbl_build_cache.outputs.cache-primary-key }}
