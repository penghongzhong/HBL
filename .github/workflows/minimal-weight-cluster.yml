name: HBL minimal-weight cluster
on:
  push:
    branches: [hbl-minimal-weight-cluster-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-minimal-cluster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze inherited chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          import pathlib,subprocess,re,json,textwrap
          base='47e494a217f3033fb1fd21f21d8566da930fdb54'
          allowed={'HBL/MinimalWeightCluster.lean','HBL/MinimalWeightClusterAudit.lean','.github/workflows/minimal-weight-cluster.yml'}
          delta=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert delta <= allowed, delta-allowed
          for p in ['HBL/MinimalWeightCluster.lean','HBL/MinimalWeightClusterAudit.lean']:
            s=pathlib.Path(p).read_text()
            clean=re.sub(r'/\-.*?\-/','',s,flags=re.S)
            assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',clean)
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          pathlib.Path('evidence/scope.json').write_text(json.dumps({
            'base':base,
            'existing_target':'prop:one-layer-stage3',
            'new_numbered_environments':0,
            'pending_original_targets':4,
            'minimal_cluster_fully_accepted':False,
            'purpose':'compile structural terminal before concrete regional-interface reconciliation'
          },indent=2))
          PY
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version | tee evidence/compiler.txt
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            ~/.cache/mathlib
          key: hbl-${{ runner.os }}-${{ hashFiles('lean-toolchain','lakefile.lean') }}
      - name: Fixed dependencies
        shell: bash
        run: |
          bash -euo pipefail /tmp/hbl-dependencies.sh
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/Analysis/InnerProductSpace/Basic.lean)
      - name: Compile structural terminal
        shell: bash
        run: |
          set -euo pipefail
          lake build HBL.MinimalWeightCluster 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/MinimalWeightCluster.lean 2>&1 | tee evidence/strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/MinimalWeightClusterAudit.lean > evidence/types-and-axioms.txt
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json
          s=pathlib.Path('evidence/types-and-axioms.txt').read_text()
          assert 'HBL.ProfileLayer.oneMinimalWeightCluster_certified' in s
          assert 'sorryAx' not in s and '⋯' not in s and '...' not in s
          found=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s,re.S)
          for n,a in found:
            assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          pathlib.Path('evidence/audit.json').write_text(json.dumps({
            'trust_zero':True,'warning_as_error':True,
            'structural_terminal_compiled':True,
            'new_numbered_environments':0,
            'pending_original_targets':4,
            'full_minimal_cluster_accepted':False
          },indent=2))
          print('PASS structural terminal; concrete regional-interface reconciliation remains')
          PY
      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git ls-files -z '*.lean' lean-toolchain lakefile.lean lake-manifest.json '.github/workflows/*.yml' | xargs -0 sha256sum > evidence/source-hashes.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-minimal-cluster-${{ github.sha }}
          path: evidence
          retention-days: 14
