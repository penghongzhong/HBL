name: HBL Kummer regular-tail strict
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeKummerRegularTailGain.lean'
      - '.github/workflows/hbl-kummer-regular-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-kummer-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || true
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-kummer-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-exterior-feedback-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict Kummer regular-tail audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeKummerRegularTailGain.lean
          module=HBL.TypeIIDynamicSelection.ActualHartreeKummerRegularTailGain
          lake build "$module" > evidence/build.log 2>&1 || { tail -180 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > KummerTailAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeKummerRegularTailGain
          set_option pp.all true
          set_option pp.maxSteps 10000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_regular_Green_tail_gain
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_outgoing_Green_tail_gain
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_both_Green_coefficients_uniform
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_regular_Green_tail_gain
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_outgoing_Green_tail_gain
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_scaled_Kummer_both_Green_coefficients_uniform
          EOF
          lake env lean --trust=0 -DwarningAsError=true KummerTailAudit.lean > evidence/audit.log 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('evidence/audit.log').read_text()
          assert 'sorryAx' not in t
          assert not re.search(r'\b(error|warning):|⋯|\.\.\.',t)
          m=re.search(r"'HBL\.TypeIIDynamicSelection\.actual_Hartree_scaled_Kummer_regular_Green_tail_gain' depends on axioms: \[([^\]]*)\]",t)
          assert m, t[-5000:]
          axioms={x.strip() for x in m.group(1).split(',') if x.strip()}
          assert axioms <= {'propext','Classical.choice','Quot.sound'},axioms
          PY
          mkdir -p evidence/sources/HBL/TypeIIDynamicSelection
          cp "$target" evidence/sources/HBL/TypeIIDynamicSelection/
          sha256sum "$target" > evidence/source-hashes.txt
          cp KummerTailAudit.lean evidence/
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .lake/build
          key: hbl-kummer-tail-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-kummer-regular-tail-audit
          path: evidence
          retention-days: 14
