name: HBL retained-chain repair
on:
  push:
    branches: [hbl-retained-chain-repair-20261028]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version > evidence/compiler.txt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .lake
          key: hbl-retained-repair-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-retained-repair-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            hbl-final-bridge-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
      - name: Resolve fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          (cd .lake/packages/mathlib && lake exe cache get Mathlib/Tactic.lean Mathlib/Analysis/Calculus/ContDiff/Convolution.lean Mathlib/Analysis/InnerProductSpace/Calculus.lean) >> evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
      - name: Strict physical spatial-core validation and retained-chain regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile verification/spatial_core_validation.py
          python3 verification/spatial_core_validation.py
      - name: Preserve exact validation reports without editing proofs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f verification/spatial-core-current-status.json; then
            git add verification/spatial-core-current-status.json verification/spatial-core-current-errors.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record actual spatial-core compiler and axiom audit outcome [skip ci]'
              git push origin HEAD:hbl-retained-chain-repair-20261028
            fi
          fi
          git archive --format=tar.gz HEAD > evidence/repository-source.tar.gz
          git diff 4999b1fc43c02841f7eb9b39b5c7f003f0b23655 HEAD > evidence/spatial-core.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-spatial-core-${{ github.sha }}
          path: evidence
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Require actual proof, complete audit and retained-chain build
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('verification/spatial-core-current-status.json'))
          assert r['source_commit']==os.environ['GITHUB_SHA']
          assert r['validation_passed'],r
          PY
