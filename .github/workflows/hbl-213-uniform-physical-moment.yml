name: HBL 2.13 same-source scale-uniform canonical moments and physical traces
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/InnerReconstruction/UniformMomentOperatorBound*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeUniformInnerMoment*.lean'
      - '.github/workflows/hbl-213-uniform-physical-moment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-uniform-physical-moment-20261104
  cancel-in-progress: true
jobs:
  strict-physical-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || echo 'Mandatory exact-source build follows.'
          lean --version > evidence/compiler-version.txt
      - name: Restore accumulated compiled source
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-uniform-physical-moment-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-uniform-physical-moment-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-uniform-moment-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-inner-moment-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-inner-C1-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict complete physical moment build and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          for f in ['HBL/InnerReconstruction/UniformMomentOperatorBound.lean','HBL/TypeIIDynamicSelection/ActualHartreeUniformInnerMoment.lean']:
              s=re.sub(r'/\-.*?\-/','',Path(f).read_text(),flags=re.S)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s),f
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeUniformInnerMoment HBL.TypeIIDynamicSelection.ActualHartreeUniformInnerMomentAudit 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/InnerReconstruction/UniformMomentOperatorBound.lean 2>&1 | tee evidence/operator-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeUniformInnerMoment.lean 2>&1 | tee evidence/physical-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeUniformInnerMomentAudit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          names=['HBL.Modulation.Monopole.actual_innerGreenBound_le_fixed_weight_norms','HBL.Modulation.Monopole.actual_inner_fixed_Fredholm_moment_constants','HBL.TypeIIDynamicSelection.actual_Hartree_uniform_canonical_inner_moments_and_traces']
          for n in names:
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT UNIFORM PHYSICAL MOMENT PASS: constants chosen before ell,c,z; original normalized two-channel equations imply actual canonical moments O(ell^(1/16)) and physical traces retaining both forced affine charges. No time rate, outer compatibility or full manuscript 2.13 claimed.')
          PY
      - name: Save incremental proof pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-uniform-physical-moment-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/InnerReconstruction/UniformMomentOperatorBound*.lean HBL/TypeIIDynamicSelection/ActualHartreeUniformInnerMoment*.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-uniform-physical-moment-audit
          path: evidence
          retention-days: 14
