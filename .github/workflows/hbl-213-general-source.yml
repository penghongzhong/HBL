name: HBL 2.13 arbitrary-source relative shell
on:
  push:
    branches: [hbl-213-conjugated-two-weight-integrated-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeGeneral*.lean'
      - '.github/workflows/hbl-213-general-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-general-source
  cancel-in-progress: true
jobs:
  strict-general-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old = subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'], text=True)
          chunk = old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic > evidence/tactic-cache.log 2>&1 || echo 'Exact-source build follows.'
          lean --version > evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - name: Restore proof pool
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-general-source-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-general-source-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-complete-obstruction-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-moment-locked-projection-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict arbitrary-source kernel and statement audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          sources = sorted(Path('HBL/TypeIIDynamicSelection').glob('ActualHartreeGeneral*.lean'))
          assert sources
          names, imports = [], []
          for p in sources:
              s = re.sub(r'/\-.*?\-/','',p.read_text(),flags=re.S)
              s = re.sub(r'--[^\n]*','',s)
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',s), str(p)
              names += ['HBL.TypeIIDynamicSelection.'+n for n in re.findall(r'^theorem\s+([A-Za-z_][A-Za-z_0-9]*)',s,re.M)]
              imports.append(str(p.with_suffix('')).replace('/','.'))
          assert names and len(names)==len(set(names))
          Path('evidence/targets.txt').write_text('\n'.join(map(str,sources))+'\n')
          Path('evidence/modules.txt').write_text(' '.join(imports))
          Path('evidence/declarations.txt').write_text('\n'.join(names)+'\n')
          header = '\n'.join('import '+m for m in imports)+'\nset_option pp.all true\nset_option pp.maxSteps 10000000\nset_option maxRecDepth 1000000\n'
          body = '\n'.join('#check @'+n+'\nset_option pp.all false in\n#print axioms '+n for n in names)
          Path('GeneralSourceAudit.lean').write_text(header+body+'\n')
          PY
          lake build $(cat evidence/modules.txt) > evidence/build.log 2>&1 || { tail -180 evidence/build.log; exit 1; }
          while IFS= read -r f; do
            lake env lean --trust=0 -DwarningAsError=true "$f" > "evidence/$(basename "$f" .lean)-strict.log" 2>&1 || { cat "evidence/$(basename "$f" .lean)-strict.log"; exit 1; }
            test ! -s "evidence/$(basename "$f" .lean)-strict.log"
          done < evidence/targets.txt
          lake env lean --trust=0 -DwarningAsError=true GeneralSourceAudit.lean > evidence/audit.log 2>&1
          python3 - <<'PY'
          import re, json
          from pathlib import Path
          text = Path('evidence/audit.log').read_text()
          names = Path('evidence/declarations.txt').read_text().splitlines()
          assert 'sorryAx' not in text
          assert not re.search(r'\b(error|warning):|⋯|\.\.\.',text)
          reports = dict(re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",text))
          assert set(reports)==set(names)
          allowed = {'propext','Classical.choice','Quot.sound'}
          for n, axioms in reports.items():
              assert set(a.strip() for a in axioms.split(',') if a.strip()) <= allowed,(n,axioms)
          Path('evidence/audit-summary.json').write_text(json.dumps({'declarations':names,'axioms':reports,'paper_accepted':11,'paper_total':13},indent=2))
          print('STRICT GENERAL SOURCE PASS',len(names),'declarations; full PDE residual recursion still open.')
          PY
      - name: Save proof pool
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-general-source-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Archive exact sources
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/sources
          if test -f evidence/targets.txt; then
            while IFS= read -r f; do sha256sum "$f" >> evidence/source-hashes.txt; cp --parents "$f" evidence/sources/; done < evidence/targets.txt
          fi
          test ! -f GeneralSourceAudit.lean || cp GeneralSourceAudit.lean evidence/
          cp lean-toolchain lake-manifest.json lakefile.lean evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-general-source-audit
          path: evidence
          retention-days: 14
