name: HBL 2.13 same Hartree PDE conjugated exterior L2 and exact inner/outer source partition
on:
  push:
    branches: [hbl-213-conjugated-exterior-L2-20261103]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeConjugatedExteriorL2*.lean'
      - 'HBL/TypeIIDynamicSelection/ActualHartreeEighthEnvelopeL2Integral*.lean'
      - '.github/workflows/hbl-213-conjugated-exterior-L2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbl-213-conjugated-exterior-L2-20261103
  cancel-in-progress: true
jobs:
  strict-inner-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          if ! test -f "$archive"; then
            curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          fi
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          if ! lake exe cache get Mathlib.Tactic Mathlib.Analysis.SpecialFunctions.ImproperIntegrals > evidence/tactic-cache.log 2>&1; then
            echo 'Exact-source cache unavailable; all required modules must compile normally.'
          fi
          lean --version > evidence/compiler-version.txt
      - name: Restore same-branch compiled source
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hbl-213-conjugated-exterior-L2-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            hbl-213-conjugated-exterior-L2-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-physical-full-weighted-L2-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
            hbl-213-ten-term-weighted-pointwise-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-
      - name: Strict physical inner build and full declaration audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('HBL/TypeIIDynamicSelection/ActualHartreeConjugatedExteriorL2.lean').read_text()
          source=re.sub(r'/\-.*?\-/','',source,flags=re.S)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b',source)
          PY
          lake build HBL.TypeIIDynamicSelection.ActualHartreeEighthEnvelopeL2Integral HBL.TypeIIDynamicSelection.ActualHartreeConjugatedExteriorL2 HBL.TypeIIDynamicSelection.ActualHartreeConjugatedExteriorL2Audit 2>&1 | tee evidence/build.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeEighthEnvelopeL2Integral.lean 2>&1 | tee evidence/integration-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeConjugatedExteriorL2.lean 2>&1 | tee evidence/source-strict.log
          lake env lean --trust=0 -DwarningAsError=true HBL/TypeIIDynamicSelection/ActualHartreeConjugatedExteriorL2Audit.lean 2>&1 | tee evidence/audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('evidence/audit.log').read_text()
          for name in ['actual_Hartree_one_source_exact_inner_exterior_partition','actual_Hartree_exterior_source_zero_before_inner_radius','actual_Hartree_conjugated_exterior_unweighted_L2']:
              n='HBL.TypeIIDynamicSelection.'+name
              assert re.search(r'(?:@)?'+re.escape(n)+r'\s*:',s),n
              m=re.search(r"'"+re.escape(n)+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,'Missing transitive axiom audit: '+n
              actual={v.strip() for v in m.group(1).split(',') if v.strip()}
              assert actual <= {'propext','Classical.choice','Quot.sound'},(n,actual)
          assert 'sorryAx' not in s
          print('STRICT OUTER SOURCE PASS: r*F is split exactly into actual Hartree localized inner and complementary exterior sources, exterior weighted radius is L2 with ell^(1/8) gain, no extra PDE source bounds. Full three-region matching and Type II rate remain OPEN.')
          PY
      - name: Save incremental build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hbl-213-conjugated-exterior-L2-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}-${{ github.sha }}
      - name: Store immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence/mathlib-commit.txt
          sha256sum HBL/TypeIIDynamicSelection/ActualHartreeConjugatedExteriorL2*.lean HBL/TypeIIDynamicSelection/ActualHartreeEighthEnvelopeL2Integral*.lean HBL/TypeIIDynamicSelection/ActualHartreeConjugatedLocalizedInner*.lean HBL/TypeIIDynamicSelection/ActualHartreePhysicalFullWeighted*.lean > evidence/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbl-213-conjugated-exterior-L2-audit
          path: evidence
          retention-days: 14
