name: HBL physical-width C3 repair endpoint jets strict
on:
  push:
    branches: [hbl-213-spectral-c1-trace-20261109]
    paths:
      - 'HBL/TypeIIDynamicSelection/ActualHartreeInterfaceC3RepairPolynomial.lean'
      - '.github/workflows/hbl-213-interface-c3-jet-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hbl-213-interface-c3-jet-audit
  cancel-in-progress: false
jobs:
  strict-interface-jets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst
          key: hbl-compiler-linux-4.35.0-rc3-1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997
      - name: Install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$HOME/.cache/hbl-pinned-compiler" "$RUNNER_TEMP/hbl-compiler"
          archive="$HOME/.cache/hbl-pinned-compiler/lean-4.35.0-rc3-linux.tar.zst"
          test -f "$archive" || curl --proto '=https' --tlsv1.2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst -o "$archive"
          echo "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  $archive" | sha256sum -c -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/hbl-compiler"
          echo "$RUNNER_TEMP/hbl-compiler/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/packages
          key: hbl-pinned-mathlib-tactics-${{ runner.os }}-a98628e16c11f5167f16124105ddce53efa9bfe5-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean') }}
      - name: Resolve exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          old=subprocess.check_output(['git','show','c640b3735f3cb08ac9a52d3136c33f3dd4163db7:.github/workflows/lean.yml'],text=True)
          chunk=old.split('      - name: Resolve exact dependencies and obtain targeted Mathlib cache\n',1)[1].split('\n      - ',1)[0]
          pathlib.Path('/tmp/hbl-dependencies.sh').write_text(textwrap.dedent(chunk.split('        run: |\n',1)[1]))
          PY
          bash -euo pipefail /tmp/hbl-dependencies.sh > evidence/dependencies.log 2>&1
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = a98628e16c11f5167f16124105ddce53efa9bfe5
          lake exe cache get Mathlib.Tactic Mathlib.Algebra.Polynomial.Derivative > evidence/tactic-cache.log 2>&1
          lean --version | tee evidence/compiler-version.txt
          grep -F '4.35.0-rc3' evidence/compiler-version.txt
          git rev-parse HEAD > evidence/commit.txt
      - name: Strict physical polynomial jets and exact per-declaration axiom audit
        shell: bash
        run: |
          set -euo pipefail
          target=HBL/TypeIIDynamicSelection/ActualHartreeInterfaceC3RepairPolynomial.lean
          lake build HBL.TypeIIDynamicSelection.ActualHartreeInterfaceC3RepairPolynomial > evidence/build.log 2>&1 || { tail -200 evidence/build.log; exit 1; }
          lake env lean --trust=0 -DwarningAsError=true "$target" > evidence/strict.log 2>&1 || { cat evidence/strict.log; exit 1; }
          test ! -s evidence/strict.log
          cat > HartreePhysicalC3RepairAudit.lean <<'EOF'
          import HBL.TypeIIDynamicSelection.ActualHartreeInterfaceC3RepairPolynomial
          set_option pp.all true
          set_option pp.maxSteps 10000000
          set_option pp.maxDepth 1000000
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_physical_C3_repair_endpoint_jets
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_physical_C3_repair_endpoint_jets
          #check @HBL.TypeIIDynamicSelection.actual_Hartree_C3_repair_factored_kernels
          set_option pp.all false in
          #print axioms HBL.TypeIIDynamicSelection.actual_Hartree_C3_repair_factored_kernels
          EOF
          lake env lean --trust=0 -DwarningAsError=true HartreePhysicalC3RepairAudit.lean > evidence/audit.log 2>&1 || { cat evidence/audit.log; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path('evidence/audit.log').read_text()
          goals=['HBL.TypeIIDynamicSelection.actual_Hartree_physical_C3_repair_endpoint_jets','HBL.TypeIIDynamicSelection.actual_Hartree_C3_repair_factored_kernels']
          assert 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          allowed={'propext','Classical.choice','Quot.sound'}
          for goal in goals:
              assert goal in data, goal
              matches=re.findall(re.escape("'"+goal+"'")+r' depends on axioms:\s*\[([^\]]*)\]',data)
              assert len(matches)==1, (goal,matches)
              names={re.sub(r'\.\{.*\}$','',a.strip()) for a in matches[0].split(',') if a.strip()}
              assert names<=allowed, (goal,names)
              print('Exact theorem and kernel axioms:',goal,sorted(names))
          print('CERTIFIED SCOPE: polynomial endpoint jets and factorizations ONLY; original count 11/13.')
          PY
          cp "$target" evidence/
          cp HartreePhysicalC3RepairAudit.lean evidence/
          sha256sum "$target" HartreePhysicalC3RepairAudit.lean > evidence/source-hashes.txt
          cat evidence/audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hbl-213-physical-c3-polynomial-jets-evidence
          path: evidence
          retention-days: 30
      - name: Append audited scope to manuscript and ledgers without changing counts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branch=hbl-213-spectral-c1-trace-20261109
          git fetch origin "$branch"
          git diff --quiet "$GITHUB_SHA" "origin/$branch" -- HBL/TypeIIDynamicSelection/ActualHartreeInterfaceC3RepairPolynomial.lean verification/HBL_213_INTERFACE_REGULARITY_GATE_20261111.tex verification/hbl_213_sync_interface_regularity.py
          git merge --ff-only "origin/$branch"
          python3 verification/hbl_213_sync_interface_regularity.py
          git add verification/HBL_213_GREEN_MOVING_TWO_CHANNEL_20261108.tex verification/HBL_213_SHORTEST_MAIN_CHAIN_CI_20261108.md verification/HBL_REVISED_213_MINIMAL_PHYSICAL_CLOSURE_TREE_20261102.md
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize actual interface regularity gate and strict C3 polynomial jet scope; original 11/13 unchanged'
          git push origin "HEAD:$branch"
          git rev-parse HEAD
